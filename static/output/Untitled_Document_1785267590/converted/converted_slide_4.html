        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #B99C6B;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 7.5rem; /* 80px 120px */
        }

        .slide-inner-container {
            width: 100%;
            height: 100%;
            max-width: 105rem; /* 1680px */
            max-height: 57.5rem; /* 920px */
            background-color: #F8F9FA;
            border-radius: 1rem; /* 16px */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
        }
        
        .left-content {
            flex: 0 0 60%;
            height: 100%;
            position: relative;
            background-color: #F8F9FA;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .right-content {
            flex: 0 0 40%;
            height: 100%;
            background-color: #B99C6B;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-container {
            width: 80%;
            height: 70%;
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 1rem 2rem rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            z-index: 3;
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .accent-bar-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 4rem; /* 64px - larger for better visibility */
            height: 2rem; /* 32px */
            background-color: #F8F9FA;
            z-index: 1;
        }
        
        .accent-bar-middle {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4rem; /* 64px - larger */
            background-color: #F8F9FA;
            transform: translateY(-50%);
            z-index: 1;
        }
        
        .content-box {
            background-color: #F8F9FA;
            padding: 5rem; /* 80px - much larger padding */
            border-radius: 0.5rem;
            z-index: 2;
            position: relative;
            width: 90%; /* 90% of left-content width */
            height: 85%; /* 85% of left-content height */
            max-width: none; /* Remove max-width constraint */
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .main-title {
            font-size: 5.5rem !important;
            color: #111827;
            margin: 0 0 3rem 0;
            font-weight: bold;
            font-style: 'Be Vietnam Pro', sans-serif;
            line-height: 1.2;
            text-align: center !important;
            display: block;
            width: 100%;

        .subtitle {

            color: #1F2937;
            margin: 1rem 0;
            line-height: 1.4;
            text-align: center !important;
            display: block;

        }
        
        .divider {

            margin: 3rem auto 0 auto; /* 48px top margin, centered */

        .decorative-element {
            position: absolute;

            opacity: 0.5;
            z-index: 1;

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
