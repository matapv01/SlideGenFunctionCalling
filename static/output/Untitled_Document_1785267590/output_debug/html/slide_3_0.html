<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon List Slide - 1920x1080</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; width: 1920px; height: 1080px; }
        body, html {
            height: 1080px;
            width: 1920px;
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #F8F9FA;
            overflow: hidden;
        }

        .slide-container {
            width: 1920px;
            height: 1080px;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 80px;
            padding: 80px 120px;
        }

        .title-column {
            padding-right: 40px;
        }

        .main-title {
            font-size: 100px;
            font-weight: 800;
            line-height: 1.2;
            color: #111827;
            margin-bottom: 30px;
        }

        .title-divider {
            height: 8px;
            width: 120px;
            background-color: #B99C6B;
            border-radius: 4px;
            border: none;
        }

        .points-column {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .icon-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px #B99C6B33;
        }

        .point-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .point-description {
            font-size: 32px;
            line-height: 1.8;
            font-weight: 400;
        }

        /* Content wrapper for scaling */
        .content-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1920px;
            height: 1080px;
            overflow: visible;
            background: inherit;
        }
        
        .outer-wrapper {
            padding: 0;
            box-sizing: border-box;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

    </style>
</head>
<body>
    <div class="outer-wrapper">
        <div class="content-wrapper">
            <div class="slide-container">
                <div class="title-column">
                    <h1 class="main-title">Đỉnh cao tại<br>Real Madrid</h1>
                    <hr class="title-divider" />
                </div>
                <div class="points-column">
                    
        <div class="point-item">
            <div class="icon-circle" style="background-color: #B99C6B;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="50px" height="50px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #1F2937;">Chuyển nhượng kỷ lục</h2>
                <p class="point-description" style="color: #4B5563;">Chuyển đến Real Madrid năm 2009 với mức phí <span style="font-weight: bold; color: #B99C6B;">kỷ lục thế giới</span>.</p>
            </div>
        </div>
        
        <div class="point-item">
            <div class="icon-circle" style="background-color: #B99C6B;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="50px" height="50px">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #1F2937;">Chân sút vĩ đại nhất</h2>
                <p class="point-description" style="color: #4B5563;">Trở thành cầu thủ ghi bàn <span style="font-weight: bold; color: #B99C6B;">hàng đầu mọi thời đại</span> của câu lạc bộ.</p>
            </div>
        </div>
        
        <div class="point-item">
            <div class="icon-circle" style="background-color: #B99C6B;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="50px" height="50px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #1F2937;">Thống trị Châu Âu</h2>
                <p class="point-description" style="color: #4B5563;">Giành <span style="font-weight: bold; color: #B99C6B;">4 chức vô địch</span> UEFA Champions League, bao gồm cú hat-trick lịch sử.</p>
            </div>
        </div>
        
                </div>
            </div>
        </div>
    </div>
</body>
</html>
