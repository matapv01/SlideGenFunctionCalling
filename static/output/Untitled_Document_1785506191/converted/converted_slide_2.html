<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; width: 1920px; height: 1080px; }
        body, html {
            height: 1080px;
            width: 1920px;
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #001e3d;
            overflow: hidden;
        }

        .slide-container {
            width: 1920px;
            height: 1080px;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 80px;
            padding: 80px 120px;
        }

        .title-column {
            padding-right: 40px;
        }

        .main-title {
            font-size: 100px;
            font-weight: 800;
            line-height: 1.2;
            color: #FFFFFF;
            margin-bottom: 30px;
        }

        .title-divider {
            height: 8px;
            width: 120px;
            background-color: #EDBB00;
            border-radius: 4px;
            border: none;
        }

        .points-column {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .icon-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px #EDBB0033;
        }

        .point-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .point-description {
            font-size: 32px;
            line-height: 1.8;
            font-weight: 400;
        }

        /* Content wrapper for scaling */
        .content-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1920px;
            height: 1080px;
            overflow: visible;
            background: inherit;
        }
        
        .outer-wrapper {
            padding: 0;
            box-sizing: border-box;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
