<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            
            html { font-size: 16px; width: 1920px; height: 1080px; }
            body, html {
                height: 1080px;
                width: 1920px;
                font-family: 'Be Vietnam Pro', sans-serif;
                background-color: #0F172A;
                color: #FFFFFF;
                overflow: hidden;
            }

            body {
                position: relative;
                padding: 80px 100px;
                display: grid;
                grid-template-rows: auto 1fr auto;
                gap: 0;
            }

            /* --- Background Decoration --- */
            .bg-circle {
                position: absolute;
                border-radius: 50%;
                background-color: rgba(255, 255, 255, 0.4);
                z-index: 0;
            }

            .circle-1 {
                width: 800px;
                height: 800px;
                top: -200px;
                right: -100px;
                border: 1px solid rgba(0,0,0,0.03);
            }

            .circle-2 {
                width: 600px;
                height: 600px;
                bottom: -150px;
                right: 200px;
                background-color: rgba(255, 255, 255, 0.6);
            }

            /* --- Header / Logo --- */
            header {
                display: flex;
                align-items: center;
                gap: 15px;
                z-index: 10;
            }

            header span {
                font-size: 24px;
                font-weight: 600;
                color: #FFFFFF;
                letter-spacing: -0.02em;
            }

            /* --- Main Content (Center) --- */
            .title-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                z-index: 10;
            }

            .title-huge {
                font-size: 200px;
                font-weight: 800;
                line-height: 0.85;
                letter-spacing: -0.04em;
                color: #FFFFFF;
                margin-bottom: 0px;
            }

            .subtitle-huge {
                font-size: 100px;
                font-weight: 300; /* Thin weight */
                line-height: 0.9;
                letter-spacing: -0.04em;
                color: #FFFFFF;
            }

            /* --- Footer (Bottom) --- */
            footer {
                position: relative;
                z-index: 10;
            }

            .presenter-info {
                position: absolute;
                bottom: 200px;
                left: 100px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 10;
            }

            .presenter-info > span:first-child {
                font-size: 20px;
                opacity: 0.7;
                font-weight: 400;
            }

            .presenter-info > span:last-child {
                font-size: 32px;
                font-weight: 700;
                letter-spacing: -0.01em;
            }

            .contact-list {
                position: absolute;
                bottom: 0;
                right: 0;
                display: flex;
                flex-direction: column;
                gap: 20px;
                text-align: left;
            }

            .contact-item {
                display: flex;
                align-items: center;
                gap: 15px;
            }

            .contact-item svg {
                width: 40px;
                height: 40px;
                padding: 8px;
                background-color: rgba(90, 107, 109, 0.1);
                border-radius: 50%;
            }
            
            .contact-item span {
                font-size: 18px;
                font-weight: 400;
                opacity: 0.9;
            }

            /* --- Decorative Corner --- */
            .corner-accent {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 350px;
                height: 150px;
                z-index: 5;
                display: block;
            }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
