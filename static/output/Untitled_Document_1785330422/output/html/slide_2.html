<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methodology Slide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #111827;
            overflow: hidden;
        }
        
        .slide-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111827;
        }
        
        .slide-container {
            width: 1920px;
            height: 1080px;
            background-color: #111827;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative circles in top right */
        .decorative-circles {
            position: absolute;
            top: 0;
            right: 40%;
            width: 250px;
            height: 250px;
            z-index: 1;
        }
        
        .circle {
            position: absolute;
            border: 3px solid #38BDF8;
            border-radius: 50%;
            opacity: 0.6;
        }
        
        .circle-1 {
            width: 100px;
            height: 100px;
            top: 30px;
            right: 80px;
        }
        
        .circle-2 {
            width: 130px;
            height: 130px;
            top: 15px;
            right: 65px;
        }
        
        .circle-3 {
            width: 160px;
            height: 160px;
            top: 0;
            right: 50px;
        }
        
        .circle-4 {
            width: 190px;
            height: 190px;
            top: -15px;
            right: 35px;
        }
        
        .circle-5 {
            width: 220px;
            height: 220px;
            top: -30px;
            right: 20px;
        }
        
        /* Title Section */
        .title-section {
            position: absolute;
            top: 30px;
            left: 0;
            display: flex;
            align-items: center;
            z-index: 2;
        }
        
        .title-accent {
            width: 100px;
            height: 100px;
            background-color: #38BDF8;
            margin-right: 20px;
        }
        
        .title {
            font-size: 75px;
            font-weight: 900;
            color: #FFFFFF;
            
        }
        
        /* Content Section */
        .content-section {
            position: absolute;
            top: 240px;
            left: 50px;
            right: 50px;
            display: flex;
            gap: 30px;
            height: 780px;
        }
        
        /* Left side - Method boxes */
        .methods-container {
            flex: 0 0 620px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .method-box {
            padding: 40px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        
        .method-box.qualitative {
            background-color: rgba(201, 168, 106, 0.3);
        }
        
        .method-box.quantitative {
            background-color: rgba(201, 168, 106, 0.5);
        }
        
        .method-title {
            font-size: 45px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 15px;
        }
        
        .method-text {
            font-size: 21px;
            line-height: 1.7;
            color: #1a1a1a;
        }
        
        /* Right side - Image */
        .image-container {
            flex: 1;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        
    </style>
</head>
<body>
    <div class="slide-wrapper">
        <div class="slide-container">
            <!-- Decorative Circles -->
            <div class="decorative-circles">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
                <div class="circle circle-4"></div>
                <div class="circle circle-5"></div>
            </div>
            
            <!-- Title Section -->
            <div class="title-section">
                <div class="title-accent"></div>
                <h1 class="title">Giới thiệu chung về Sơn Tùng M-TP</h1>
            </div>
            
            <!-- Content Section -->
            <div class="content-section">
                <!-- Methods Container -->
                <div class="methods-container">
                    <!-- Qualitative Methods Box -->
                    <div class="method-box qualitative">
                        <h2 class="method-title">Thông tin cá nhân</h2>
                        <p class="method-text"><span style="color: #CBD5E1">Tên thật: Nguyễn Thanh Tùng (05/07/1994)<br>Nghệ danh: <span style="font-weight: bold; color: #38BDF8">Sơn Tùng M-TP</span> (Music-Talent-Personality)</span></p>
                    </div>
                    
                    <!-- Quantitative Methods Box -->
                    <div class="method-box quantitative">
                        <h2 class="method-title">Sự nghiệp & Vị thế</h2>
                        <p class="method-text"><span style="color: #CBD5E1">Vai trò: Ca sĩ, nhạc sĩ, diễn viên, nhà sản xuất âm nhạc<br>Vị thế: Nghệ sĩ hàng đầu và có sức ảnh hưởng lớn nhất V-Pop</span></p>
                    </div>
                </div>
                
                <!-- Image Container -->
                <div class="image-container">
                    <img src="https://phunuvietnam.mediacdn.vn/179072216278405120/2024/3/14/4313607349734442041379735394809685579526974n-17103912551841717330032.jpeg" alt="Professional working with technology">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
