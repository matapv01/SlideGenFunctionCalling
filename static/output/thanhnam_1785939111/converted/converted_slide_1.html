<style>
        :root {
            --accent-color: #0D9488;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            background-color: #F9FAFB;
            color: #0F172A;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 4rem 5rem;
            position: relative;
        }

        .text-content {
            max-width: 50%;
            z-index: 2;
        }

        .main-title {
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 2rem;
        }

        .subtitle {
            font-size: 1.85rem;
            line-height: 1.6;
            color: #334155;
            opacity: 0.9;
            margin-bottom: 3rem;
            max-width: 35ch;
        }
        
        .author-line {
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
        }

        .glowing-portal {
            position: absolute;
            width: 45rem;
            height: 45rem;
            right: -10rem;
            top: 50%;
            transform: translateY(-50%);
            border: 4px solid var(--accent-color);
            border-radius: 50%;
            box-shadow: 
                0 0 20px 0 var(--accent-color),
                inset 0 0 20px 0 var(--accent-color),
                0 0 60px 10px rgba(56, 189, 248, 0.3);
            /* ĐÃ XÓA: animation: spin 80s linear infinite; */
            z-index: 1;
        }

        /* ĐÃ XÓA: @keyframes spin */

        @media (max-width: 64rem) {
            .slide-container { 
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding: 2rem;
            }
            .text-content { max-width: 100%; }
            .glowing-portal {
                width: 30rem;
                height: 30rem;
                right: 50%;
                top: 50%;
                transform: translate(50%, -50%);
                opacity: 0.3;
            }
        }

</div><script>
(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
