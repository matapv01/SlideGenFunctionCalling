<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh; width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif; overflow: hidden;
        }
        .slide-container { width: 100%; height: 100%; display: flex; }
        .left-column {
            flex: 1; max-width: 35%;
            background-color: #FFFFFF; color: #F5F0E8;
            padding: 3rem; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .right-column {
            flex: 2; background-color: #F8FAFC; color: #6F6254;
            padding: 4rem 3rem; overflow-y: auto;
        }
        .points-list { display: flex; flex-direction: column; gap: 2rem; }
        .point-item:not(:last-child) {
            padding-bottom: 2rem; border-bottom: 1px solid #D3CFC7;
        }

        /* Font size styles */
        .main-title {
            font-size: clamp(calc(2.5rem * 1.3), calc(6vw * 1.3), calc(4rem * 1.3));
            font-weight: 900; line-height: 1.2; text-transform: uppercase;
        }
        .point-title {
            font-size: clamp(calc(1.1rem * 1.3), calc((1.5vw + 0.2rem) * 1.3), calc(1.35rem * 1.3));
            font-weight: 900; text-transform: uppercase; margin-bottom: 0.75rem;
        }
        .point-description {
            font-size: clamp(calc(1rem * 1.3), calc((1vw + 0.1rem) * 1.3), calc(1.1rem * 1.3));
            line-height: 1.6; font-weight: 400; max-width: 45rem;
        }
        
        @media (max-width: 768px) {
            .slide-container { flex-direction: column; overflow-y: auto; }
            .left-column { max-width: 100%; width: 100%; flex: none; height: auto; min-height: 12rem; padding: 2rem; }
            .right-column { flex: none; width: 100%; padding: 2.5rem 2rem; }
        }

.svg-block > svg{width:100%;height:100%;display:block;}

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
