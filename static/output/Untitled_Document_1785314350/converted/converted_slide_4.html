<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            background-color: #0B1120;
            position: relative;
        }

        .graphic-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1;
        }
        .circle {
            position: absolute; border-radius: 50%;
            background: linear-gradient(135deg, #0B1120, #1E293B, #00CFFF);
            filter: blur(120px);
            opacity: 0.5;
        }
        .circle-1 { width: 30rem; height: 30rem; top: -10rem; left: -10rem; }
        .circle-2 { width: 30rem; height: 30rem; bottom: -15rem; right: -15rem; }

        .slide-container {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
            padding: 4rem; position: relative;
            z-index: 3;
        }
        
        .header-text {
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 800;
            line-height: 1.15;
            color: #FFFFFF;
            text-align: center;
            max-width: 20ch;
        }

        /* ĐÃ XÓA: Toàn bộ phần CSS cho các hình khối động đã được loại bỏ. */

    </style><style>
*{box-sizing:border-box;}
html { width: 1920px; height: 1080px; }
body {

  background: rgb(11, 17, 32);
  overflow: auto;
  
  
  /* KHÔNG đặt width/height cho body */
}
.outer-wrapper{padding:0;box-sizing:border-box;width:1920px;height:1080px;overflow:hidden;}
.content-wrapper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center center;width:1920px;height:1080px;overflow:visible;background:inherit;box-sizing:border-box;}
.svg-block > svg{width:100%;height:100%;display:block;}
</style></head><body><div class="outer-wrapper"><div class="content-wrapper">

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
