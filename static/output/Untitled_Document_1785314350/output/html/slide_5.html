<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Tech List Slide</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100vh; width: 100vw; font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            background-color: #0B1120;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, #0B1120, #1E293B);
            background-size: 25px 25px, 100% 100%;
        }
        .slide-container {
            width: 100%; height: 100%; display: flex;
            align-items: center; position: relative;
        }
        
        /* ĐÃ XÓA: Toàn bộ CSS cho tên lửa và animation peek */

        .accent-border {
            position: absolute;
            left: 4rem; top: 4rem; bottom: 4rem;
            width: 5px;
            background: #F97316;
            border-radius: 3px;
        }
        
        .content-wrapper {
            z-index: 10;
            padding: 4rem 4rem 4rem 8rem;
            max-width: 70%;
        }
        
        .slide-title {
            font-size: 4rem;
            font-weight: 800; color: #FFFFFF;
            margin-bottom: 3rem;
        }
        .item-list { list-style: none; margin-bottom: 2.5rem; }
        .list-item {
            display: flex; align-items: flex-start;
            font-size: 2rem;
            color: #FFFFFF; line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        .bullet-icon {
            width: 1.2em; height: 1.2em;
            margin-right: 1.2rem; margin-top: 0.2em;
            flex-shrink: 0;
        }
        .concluding-text {
            font-size: 1.5rem;
            color: #FFFFFF; line-height: 1.8;
            border-left: 4px solid #F97316;
            padding-left: 1.5rem;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .content-wrapper { max-width: 90%; padding: 4rem 2rem; }
            .accent-border { left: 1.5rem; top: 2rem; bottom: 2rem; }
            .slide-container { justify-content: center; text-align: center; }
            .list-item, .concluding-text { text-align: left; }
        }
        
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-border"></div>
        
        <div class="content-wrapper">
            <h1 class="slide-title">TÁC ĐỘNG TIÊU CỰC CỦA AI ĐẾN XÃ HỘI</h1>
            <ul class="item-list">
                <li class="list-item">
    <svg class="bullet-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#F97316" stroke-width="2" fill="#FFFFFF" />
        <circle cx="12" cy="12" r="4" fill="#F97316" />
    </svg>
    <span>⚖️ <span style="font-weight: bold;">Thiên vị và phân biệt đối xử</span> trong các thuật toán AI</span></li><li class="list-item">
    <svg class="bullet-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#F97316" stroke-width="2" fill="#FFFFFF" />
        <circle cx="12" cy="12" r="4" fill="#F97316" />
    </svg>
    <span>⚙️ <span style="font-weight: bold;">Nguy cơ mất việc làm</span> do tự động hóa và AI</span></li><li class="list-item">
    <svg class="bullet-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#F97316" stroke-width="2" fill="#FFFFFF" />
        <circle cx="12" cy="12" r="4" fill="#F97316" />
    </svg>
    <span>🔒 Ảnh hưởng đến <span style="font-weight: bold;">quyền riêng tư</span> và bảo mật dữ liệu cá nhân</span></li>
            </ul>
            <p class="concluding-text">Sự phát triển của AI cần đi đôi với các <span style="font-weight: bold;">chuẩn mực đạo đức</span> và khung pháp lý chặt chẽ.</p>
        </div>
    </div>
</body>
</html>
