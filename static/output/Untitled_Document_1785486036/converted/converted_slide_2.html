<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100vh; width: 100vw; font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            background-color: #1E1B4B;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, #1E1B4B, #312E81);
            background-size: 25px 25px, 100% 100%;
        }
        .slide-container {
            width: 100%; height: 100%; display: flex;
            align-items: center; position: relative;
        }
        
        /* ĐÃ XÓA: Toàn bộ CSS cho tên lửa và animation peek */

        .accent-border {
            position: absolute;
            left: 4rem; top: 4rem; bottom: 4rem;
            width: 5px;
            background: #FACC15;
            border-radius: 3px;
        }
        
        .content-wrapper {
            z-index: 10;
            padding: 4rem 4rem 4rem 8rem;
            max-width: 70%;
        }
        
        .slide-title {
            font-size: clamp(calc(4rem * 1.0), calc((5vw + 1.5rem) * 1.0), calc(6.5rem * 1.0));
            font-weight: 800; color: #DBEAFE;
            margin-bottom: 3rem;
        }
        .item-list { list-style: none; margin-bottom: 2.5rem; }
        .list-item {
            display: flex; align-items: flex-start;
            font-size: clamp(calc(1.8rem * 1.0), calc((2vw + 0.5rem) * 1.0), calc(2.4rem * 1.0));
            color: #DBEAFE; line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        .bullet-icon {
            width: 1.2em; height: 1.2em;
            margin-right: 1.2rem; margin-top: 0.2em;
            flex-shrink: 0;
        }
        .concluding-text {
            font-size: clamp(calc(1.8rem * 1.0), calc((2vw + 0.5rem) * 1.0), calc(2.4rem * 1.0));
            color: #DBEAFE; line-height: 1.8;
            border-left: 4px solid #FACC15;
            padding-left: 1.5rem;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .content-wrapper { max-width: 90%; padding: 4rem 2rem; }
            .accent-border { left: 1.5rem; top: 2rem; bottom: 2rem; }
            .slide-container { justify-content: center; text-align: center; }
            .list-item, .concluding-text { text-align: left; }
        }
        .title { color: #FFFFFF !important; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.list-item { margin-bottom: 1.5rem !important; }
.concluding-text { color: #FACC15 !important; font-weight: 600; border-top: 1px solid rgba(250, 204, 21, 0.3); padding-top: 1rem; }
    </style><style>

  overflow: auto;

.svg-block > svg{width:100%;height:100%;display:block;}

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
