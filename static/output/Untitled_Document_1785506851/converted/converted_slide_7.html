<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1920px; height: 1080px; font-family: 'Be Vietnam Pro', sans-serif; background-color: #0a0a0a; overflow: hidden; }
        
        .main-title {
            position: absolute; left: 120px; top: 400px;
            font-size: 280px; font-weight: 800;
            color: #F3EFE0;
            line-height: 0.8;
        }

        .divider {
            position: absolute; left: 120px; top: 750px;
            width: 100px; height: 12px;
            background-color: #F3EFE0;
        }

        .footer {
            position: absolute; left: 120px; bottom: 80px;
            font-size: 24px; text-transform: uppercase;
            letter-spacing: 4px;
            color: #F3EFE0; opacity: 0.5;
        }
    </style><style>
*{box-sizing:border-box;}
html { width: 1920px; height: 1080px; }
body {
  margin: 0;
  padding: 2rem;
  background: rgb(10, 10, 10);
  overflow: auto;
  
  
  /* KHÔNG đặt width/height cho body */
}
.outer-wrapper{padding:0;box-sizing:border-box;width:1920px;height:1080px;overflow:hidden;}
.content-wrapper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center center;width:1920px;height:1080px;overflow:visible;background:inherit;box-sizing:border-box;}
.svg-block > svg{width:100%;height:100%;display:block;}
</style></head><body><div class="outer-wrapper"><div class="content-wrapper">
    <h1 style='position:absolute;z-index:100;left:120px;top:400px;width:1800px;height:448px;box-sizing:border-box;color: rgb(243, 239, 224); background: rgba(0, 0, 0, 0) none repeat scroll 0% 0% / auto padding-box border-box; background-color: rgba(0, 0, 0, 0); background-position: 0% 0%; background-repeat: repeat; background-attachment: scroll; background-clip: border-box; font-family: "Be Vietnam Pro", sans-serif; font-size: 280px; font-weight: 800; line-height: 224px; text-align: start; opacity: 1; transform-origin: 900px 224px; fill: rgb(0, 0, 0); stroke-width: 1px; stroke-linecap: butt; stroke-linejoin: miter; transition: all; list-style-type: disc; list-style-position: outside; box-sizing: border-box; line-height: 224px; text-align: start; vertical-align: baseline; width: 1800px; height: 448px; object-fit: fill; object-position: 50% 50%; display: block; border-top: 0px none rgb(243, 239, 224); border-right: 0px none rgb(243, 239, 224); border-bottom: 0px none rgb(243, 239, 224); border-left: 0px none rgb(243, 239, 224); ' class="main-title">Lời cảm ơn chân thành</h1>
    <div style='position:absolute;z-index:101;left:120px;top:750px;width:100px;height:12px;box-sizing:border-box;color: rgb(0, 0, 0); background: rgb(243, 239, 224) none repeat scroll 0% 0% / auto padding-box border-box; background-color: rgb(243, 239, 224); background-position: 0% 0%; background-repeat: repeat; background-attachment: scroll; background-clip: border-box; font-family: "Be Vietnam Pro", sans-serif; font-size: 16px; font-weight: 400; text-align: start; opacity: 1; transform-origin: 50px 6px; fill: rgb(0, 0, 0); stroke-width: 1px; stroke-linecap: butt; stroke-linejoin: miter; transition: all; list-style-type: disc; list-style-position: outside; box-sizing: border-box; text-align: start; vertical-align: baseline; width: 100px; height: 12px; object-fit: fill; object-position: 50% 50%; display: block; border-top: 0px none rgb(0, 0, 0); border-right: 0px none rgb(0, 0, 0); border-bottom: 0px none rgb(0, 0, 0); border-left: 0px none rgb(0, 0, 0); ' class="divider"></div>
</div><script>
(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
