<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            background-color: white;
        }

        .text-column {
            flex: 1.2;
            background-color: #1e3a8a;
            color: #ffffff;
            clip-path: url(#angled-divider);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6rem 5rem;
        }

        .image-column {
            flex: 1;
            background-image: url('https://images.pexels.com/photos/1103970/pexels-photo-1103970.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
        }

        .title-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-title {
            font-size: clamp(3.5rem, 6vw, 6rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 6rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 2rem;
            font-weight: 400;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 42rem;
        }

        .footer-decor {
            width: 100%;
            height: 5rem;
            background-color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .arcs {
            width: 5rem;
            height: 5rem;
            position: relative;
        }
        .arcs::before, .arcs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 0.125rem solid #ffffff;
            left: -3.5rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .arcs::before { width: 7rem; height: 7rem; }
        .arcs::after { width: 6rem; height: 6rem; }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .dot {
            width: 0.75rem;
            height: 0.75rem;
            background-color: #ffffff;
            border-radius: 50%;
        }
        
        @media (max-width: 64rem) {
            .text-column {
                flex: 1;
                clip-path: none;
            }
            .image-column { flex: 1; }
        }

        @media (max-width: 48rem) {
            .slide-container { flex-direction: column; }
            .text-column, .image-column { flex: none; width: 100%; }
            .text-column { height: 60vh; padding: 2.5rem; justify-content: center; text-align: center; }
            .image-column { height: 40vh; }
            .footer-decor { display: none; }
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
