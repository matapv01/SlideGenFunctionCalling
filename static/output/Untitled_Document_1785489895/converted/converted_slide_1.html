<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        :root { font-size: 16px; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            background-color: #0B0E14;
        }
        
        .slide-container {
            width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 4vw; box-sizing: border-box;
        }
        
        .content-wrapper {
            display: flex; align-items: center; justify-content: center;
            width: 100%; max-width: 75rem; /* 1200px */
        }
        
        /* Image Section with Decorative Frame */
        .image-section {
            flex: 1;
            position: relative;
            height: 28rem; /* 448px */
        }
        .accent-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 90%;
            height: 90%;
            background-color: #B8860B;
            z-index: 1;
        }
        .main-image {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 90%;
            height: 90%;
            object-fit: cover;
            z-index: 2;
            box-shadow: 0 1rem 2rem rgba(0,0,0,0.1);
        }
        
        /* Text Section */
        .text-section {
            flex: 1;
            padding-left: 5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .main-title {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 5rem;
            font-weight: 600;
            font-style: italic;
            color: #FFD700;
            margin: 0 0 2rem 0;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }
        
        .subtitle {
            font-size: 1.15rem;
            font-weight: 600;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-bottom: 2.5rem;
        }

        .agenda-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .agenda-item {
            font-size: 1.75rem;
            color: #FFFFFF;
            margin-bottom: 1.5rem;
            font-weight: 400;
            line-height: 1.4;
        }

        /* Responsive Design */
        @media (max-width: 56.25em) { /* 900px */
            .text-section { padding-left: 3rem; }
            .main-title { font-size: 3rem; }
            .agenda-item { font-size: 1rem; }
        }
        @media (max-width: 48em) { /* 768px */
            .content-wrapper { flex-direction: column; }
            .image-section { width: 80%; height: 20rem; margin-bottom: 3rem; }
            .text-section { width: 80%; padding-left: 0; text-align: center; }
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
