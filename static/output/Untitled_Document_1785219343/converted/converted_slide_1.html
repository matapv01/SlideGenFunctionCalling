<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html { 
            font-size: 16px; 
            width: 100%;
            height: 100%;
        }
        
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
        }
        
        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #111827;
            position: relative;
        }
        
        /* Content wrapper for scaling */
        .content-wrapper {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: inherit;
        }
        
        .outer-wrapper {
            padding: 0;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* Top text section */
        .text-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 5% 7%;
            background: #111827;
        }
        
        .title {
            font-size: clamp(2rem, 8vw, 7rem);
            font-weight: 300;
            color: #FFFFFF;
            margin-bottom: 2rem;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }
        
        .description {
            font-size: clamp(1rem, 2.5vw, 2.4rem);
            color: #D1D5DB;
            line-height: 1.5;
            max-width: 90%;
            font-weight: 300;
        }
        
        /* Bottom image section */
        .image-section {
            height: 55%;
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        
        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        

    </style><style>

.svg-block > svg{width:100%;height:100%;display:block;}

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
