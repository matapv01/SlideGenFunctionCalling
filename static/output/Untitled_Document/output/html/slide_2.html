<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text and Image Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #1E293B;
            overflow: hidden;
            background-color: #F8F8F8;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        .text-column {
            flex: 1.5; /* Takes more space */
            padding: 2rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Layered background for the text column only */
            background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/paper.png');
            background-repeat: repeat;
            background-position: center;
            background-size: auto;
        }
        
        .image-column {
            flex: 1; /* Takes less space */
            background-image: url('https://picsum.photos/seed/821/1600/900');
            background-size: cover;
            background-position: center;
        }

        .title {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: clamp(3rem, 4vw, 4rem);
            font-weight: 400;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }
        
        .text-content {
            font-size: 2rem;
            line-height: 1.8;
            max-width: 35ch; /* Limit line length for readability */
        }
        
        /* --- Responsive Design --- */
        @media (max-width: 48rem) { /* 768px */
            .slide-container {
                flex-direction: column;
            }
            .text-column {
                height: 60vh;
                padding: 2rem 2rem 4rem 2rem;
                justify-content: center;
                text-align: center;
            }
            .text-content {
                margin: 0 auto;
            }
            .image-column {
                height: 40vh;
            }
        }

    </style>
</head>
<body>
    <div class="slide-container">
        <div class="text-column">
            <h1 class="title">Lionel Messi</h1>
            <p class="text-content"><span style="color: #2563EB; font-weight: bold;">1. Giới thiệu</span><br>Lionel Andrés Messi Cuccittini, sinh ngày <span style="color: #2563EB; font-weight: bold;">24 tháng 6 năm 1987</span> tại Rosario, Argentina.<br>Biệt danh “El Pulga” gắn liền với vóc dáng 1m70 và sự linh hoạt phi thường.<br>Vượt qua căn bệnh <span style="color: #2563EB; font-weight: bold;">thiếu hụt hormone tăng trưởng</span> để trở thành huyền thoại bóng đá.</p>
        </div>
        <div class="image-column"></div>
    </div>
</body>
</html>
