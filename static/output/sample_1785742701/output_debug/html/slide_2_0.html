<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Layout List Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh; width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif; overflow: hidden;
        }
        .slide-container { width: 100%; height: 100%; display: flex; }
        .left-column {
            flex: 1; max-width: 35%;
            background-color: #34495E; color: #FFFFFF;
            padding: 3rem; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .right-column {
            flex: 2; background-color: #2C3E50; color: #FFFFFF;
            padding: 4rem 3rem; overflow-y: auto;
        }
        .points-list { display: flex; flex-direction: column; gap: 2rem; }
        .point-item:not(:last-child) {
            padding-bottom: 2rem; border-bottom: 1px solid #1ABC9C;
        }

        /* Font size styles */
        .main-title {
            font-size: 36px;
            font-weight: 900; line-height: 1.2; text-transform: uppercase;
        }
        .point-title {
            font-size: 24px;
            font-weight: 900; text-transform: uppercase; margin-bottom: 0.75rem;
        }
        .point-description {
            font-size: 24px;
            line-height: 1.6; font-weight: 400; max-width: 45rem;
        }
        
        @media (max-width: 768px) {
            .slide-container { flex-direction: column; overflow-y: auto; }
            .left-column { max-width: 100%; width: 100%; flex: none; height: auto; min-height: 12rem; padding: 2rem; }
            .right-column { flex: none; width: 100%; padding: 2.5rem 2rem; }
        }
        
        background: linear-gradient(#34495E, #2C3E50);
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-column">
            <h1 class="main-title">2. Slide 2: Các lợi ích chính</h1>
        </div>
        <div class="right-column">
            <div class="points-list">
                
        <div class="point-item">
            <h2 class="point-title"></h2>
            <p class="point-description"><span style="color:#1ABC9C;">•</span> Dễ dàng <span style="color:#1ABC9C;">quản lý trạng thái</span> qua các bước.</p>
        </div>
        
        <div class="point-item">
            <h2 class="point-title"></h2>
            <p class="point-description"><span style="color:#1ABC9C;">•</span> Hỗ trợ các <span style="color:#1ABC9C;">chu trình</span> và vòng lặp một cách tự nhiên.</p>
        </div>
        
        <div class="point-item">
            <h2 class="point-title"></h2>
            <p class="point-description"><span style="color:#1ABC9C;">•</span> Tăng khả năng <span style="color:#1ABC9C;">gỡ lỗi</span> và quan sát luồng dữ liệu.</p>
        </div>
        
            </div>
        </div>
    </div>
</body>
</html>
