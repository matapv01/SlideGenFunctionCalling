<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            text-align: center;
            background-image: 
                radial-gradient(circle, rgba(212, 175, 55, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, #121212, #1a1a1a, #121212);
            background-size: 20px 20px, 100% 100%;
        }
        
        /* --- ĐÃ XÓA: Toàn bộ phần CSS của tên lửa --- */

        .headline {
            font-size: 5rem !important;
            font-weight: 700;
            color: #F5F5F5;
            line-height: 1.25;
            margin: 0 auto 3rem auto;
            text-align: center !important;
            display: block;
            width: 100%;
            padding: 0 100px;
        }

        .subtitle {
            font-size: 3rem !important;
            font-weight: 400;
            color: #D4AF37;
            line-height: 1.5;
            margin: 0 auto 0 auto;
            text-align: center !important;
            display: block;
            width: 100%;
            padding: 0 100px;
        }

    </style><style>
*{box-sizing:border-box;}
html { width: 1920px; height: 1080px; }
body {
  margin: 0;
  padding: 2rem;
  background: transparent;
  overflow: auto;
  
  
  /* KHÔNG đặt width/height cho body */
}
.outer-wrapper{padding:0;box-sizing:border-box;width:1920px;height:1080px;overflow:hidden;}
.content-wrapper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center center;width:1920px;height:1080px;overflow:visible;background:inherit;box-sizing:border-box;}
.svg-block > svg{width:100%;height:100%;display:block;}
</style></head><body><div class="outer-wrapper"><div class="content-wrapper">
    <h1 style='position:absolute;z-index:101;left:0px;top:430px;width:1920px;height:100px;box-sizing:border-box;color: rgb(245, 245, 245); background: rgba(0, 0, 0, 0) none repeat scroll 0% 0% / auto padding-box border-box; background-color: rgba(0, 0, 0, 0); background-position: 0% 0%; background-repeat: repeat; background-attachment: scroll; background-clip: border-box; font-family: "Be Vietnam Pro", sans-serif; font-size: 80px; font-weight: 700; line-height: 100px; text-align: center; opacity: 1; transform-origin: 960px 50px; fill: rgb(0, 0, 0); stroke-width: 1px; stroke-linecap: butt; stroke-linejoin: miter; transition: all; list-style-type: disc; list-style-position: outside; margin: 0px 0px 48px; margin-bottom: 48px; padding: 0px 100px; padding-right: 100px; padding-left: 100px; box-sizing: border-box; line-height: 100px; text-align: center; vertical-align: baseline; width: 1920px; height: 100px; object-fit: fill; object-position: 50% 50%; display: block; border-top: 0px none rgb(245, 245, 245); border-right: 0px none rgb(245, 245, 245); border-bottom: 0px none rgb(245, 245, 245); border-left: 0px none rgb(245, 245, 245); ' class="headline">PHẦN 2: TRANSITION</h1>
    <p style='position:absolute;z-index:102;left:0px;top:578px;width:1920px;height:72px;box-sizing:border-box;color: rgb(212, 175, 55); background: rgba(0, 0, 0, 0) none repeat scroll 0% 0% / auto padding-box border-box; background-color: rgba(0, 0, 0, 0); background-position: 0% 0%; background-repeat: repeat; background-attachment: scroll; background-clip: border-box; font-family: "Be Vietnam Pro", sans-serif; font-size: 48px; font-weight: 400; line-height: 72px; text-align: center; opacity: 1; transform-origin: 960px 36px; fill: rgb(0, 0, 0); stroke-width: 1px; stroke-linecap: butt; stroke-linejoin: miter; transition: all; list-style-type: disc; list-style-position: outside; padding: 0px 100px; padding-right: 100px; padding-left: 100px; box-sizing: border-box; line-height: 72px; text-align: center; vertical-align: baseline; width: 1920px; height: 72px; object-fit: fill; object-position: 50% 50%; display: block; border-top: 0px none rgb(212, 175, 55); border-right: 0px none rgb(212, 175, 55); border-bottom: 0px none rgb(212, 175, 55); border-left: 0px none rgb(212, 175, 55); ' class="subtitle">BIỂU TƯỢNG ĐẾN NGÔI SAO</p>
</div><script>
(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
