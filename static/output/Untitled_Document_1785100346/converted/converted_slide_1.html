<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; width: 1920px; height: 1080px; }
        body, html {
            height: 1080px;
            width: 1920px;
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #111827;
            color: #F9FAFB;
            overflow: hidden;
        }

        .slide-container {
            width: 1920px;
            height: 1080px;
            position: relative;
            background-color: #111827;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 80px 120px;
            gap: 80px;
        }

        .text-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 40px;
            z-index: 10;
        }

        .main-title {
            font-size: 112px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 40px;
            max-width: 720px;
        }

        .subtitle {
            font-size: 36px;
            line-height: 1.6;
            opacity: 0.85;
            max-width: 600px;
            font-weight: 400;
        }

        .image-column {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
            height: 420px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- Decorations --- */
        .star-cluster {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 20;
        }
        
        .star-cluster .star { 
            position: absolute; 
            opacity: 0.9; 
        }
        
        .star-cluster .star:nth-child(1) { 
            width: 28px; 
            height: 28px; 
            top: 0; 
            left: 0; 
        }
        
        .star-cluster .star:nth-child(2) { 
            width: 22px; 
            height: 22px; 
            top: 30px; 
            left: 10px; 
        }
        
        .star-cluster .star:nth-child(3) { 
            width: 18px; 
            height: 18px; 
            top: 8px; 
            left: 36px; 
        }

        .botanical-frame {
            position: absolute;
            bottom: -40px;
            right: -40px;
            width: 200px;
            height: 200px;
            opacity: 0.8;
            pointer-events: none;
            transform: scaleX(-1);
            z-index: 5;
        }

        /* Content wrapper for scaling */
        .content-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1920px;
            height: 1080px;
            overflow: visible;
            background: inherit;
        }
        
        .outer-wrapper {
            padding: 0;
            box-sizing: border-box;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
