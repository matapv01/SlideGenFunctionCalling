<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SlideGen - Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/edit.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        #editorPage {
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding-top: 20px;
        }

        .sidebar {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 0.5rem;
            color: #ffffff;
            height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .editor-area {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 0.5rem;
            color: #ffffff;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        #toolbar .btn {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        #toolbar .btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #toolbar select {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.375rem 0.75rem;
            border-radius: 0.25rem;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
        }

        #toolbar select option {
            background-color: #764ba2;
            color: #ffffff;
        }

        #colorPicker {
            vertical-align: middle;
            margin-left: 0.5rem;
            width: 30px;
            height: 30px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
        }

        .slide-container {
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            min-height: 400px;
            flex-grow: 1;
            padding: 20px;
            border-radius: 0.5rem;
            overflow-y: auto;
        }

        .slide-list .slide-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .slide-list .slide-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .slide-list .slide-item.active {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.3);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        #toastContainer .toast {
            background-color: rgba(40, 167, 69, 0.8);
            color: #ffffff;
        }

        #toastContainer .toast-header {
            background-color: rgba(40, 167, 69, 0.9);
            color: #ffffff;
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div id="editorPage" class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar">
                <h4>Slides</h4>
                <div id="slideList" class="slide-list"></div>
                <button class="btn btn-success mt-3 w-100" onclick="createNewSlide()">Add Slide</button>
            </div>
            <div class="col-md-9 editor-area">
                <div id="toolbar" class="mb-3">
                    <button class="btn btn-light" onclick="document.execCommand('bold', false, null)"><i class="bi bi-type-bold"></i></button>
                    <button class="btn btn-light" onclick="document.execCommand('italic', false, null)"><i class="bi bi-type-italic"></i></button>
                    <button class="btn btn-light" onclick="document.execCommand('underline', false, null)"><i class="bi bi-type-underline"></i></button>
                    <input type="color" id="colorPicker" title="Chọn màu chữ">
                    <button class="btn btn-light btn-sm" onclick="applyTextColor()">OK</button>
                    <select id="fontSizeSelect" onchange="changeFontSize()">
                        <option value="12">12px</option>
                        <option value="16">16px</option>
                        <option value="20">20px</option>
                        <option value="24">24px</option>
                        <option value="32">32px</option>
                        <option value="40">40px</option>
                    </select>
                    <select id="fontFamilySelect" onchange="changeFontFamily()">
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                    <button class="btn btn-primary ms-3" onclick="exportToPDF()">Export PDF</button>
                    <button class="btn btn-primary ms-2" onclick="exportToZip()">Export ZIP</button>
                    <button class="btn btn-secondary ms-2" onclick="showHome()">Back</button>
                </div>
                <div id="slideContainer" class="slide-container" contenteditable="true"></div>
            </div>
        </div>
    </div>
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner-border text-light" role="status"></div>
        <span id="loadingText" class="text-light ms-2"></span>
    </div>
    <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
