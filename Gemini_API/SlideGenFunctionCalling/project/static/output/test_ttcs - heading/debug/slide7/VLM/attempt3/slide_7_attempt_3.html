<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-outer-container {
            width: 1000px;
            height: 560px;
            background-color: #6ea88a;
            padding: 30px;
            box-sizing: border-box;
        }
        
        .slide-inner-container {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
        }
        
        .main-title {
            font-size: 32px;
            color: #333333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 40px;
        }
        
        .columns-container {
            display: flex;
            flex: 1;
            gap: 30px;
        }
        
        .left-column {
            flex: 1;
            background-color: #6ea88a;
            padding: 30px;
        }
        
        .right-column {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #6ea88a;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="slide-outer-container">
        <div class="slide-inner-container">
            <h1 class="main-title">TẦM NHÌN VÀ SỨ MỆNH</h1>
            
            <div class="columns-container">
                <div class="left-column">
                    
        <div class="left-section" style="margin-bottom: 30px;">
            <h2 style="font-size: 24px; color: #ffffff; margin-top: 0; margin-bottom: 10px;">Your Title Here</h2>
            <p style="font-size: 18px; color: #ffffff; margin: 0;">- Trở thành đối tác công nghệ <b><i><span style='color:#3B82F6'>đáng tin cậy hàng đầu</span></i></b> cho các <b><i><span style='color:#3B82F6'>doanh nghiệp vừa và nhỏ tại Việt Nam</span></i></b>, thúc đẩy sự thành công của họ thông qua các <b><i><span style='color:#3B82F6'>giải pháp công nghệ đổi mới</span></i></b>.</p>
        </div>
        
                </div>
                
                <div class="right-column">
                    
        <div class="right-section" style="display: flex; align-items: flex-start; margin-bottom: 30px;">
            <div style="margin-right: 15px; flex-shrink: 0;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#a2c4c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M16 13l-4 4h-4v-4l8-8z"></path>
        </svg></div>
            <div>
                <h2 style="font-size: 24px; color: #333333; margin-top: 0; margin-bottom: 10px;">Sứ mệnh của chúng tôi</h2>
                <p style="font-size: 18px; color: #555555; margin: 0;">Xem trang kế tiếp để biết chi tiết.</p>
            </div>
        </div>
        
                </div>
            </div>
        </div>
    </div>
</body>
</html>
