<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Segoe UI, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
            box-sizing: border-box;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            margin-bottom: 60px; /* Increased margin to move content boxes down */
        }
        
        .title-accent {
            width: 30px;
            height: 30px;
            background-color: #e6f2dd;
            margin-right: 15px;
        }
        
        .main-title {
            font-size: 48px;
            color: #333333;
            font-weight: normal;
            font-style: italic;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Center content boxes vertically */
            height: calc(100% - 120px); /* Adjusted to account for larger title margin */
        }
        
        .content-box {
            width: 31%;
            height: 250px; /* Fixed height for content boxes */
            background-color: #e6f2dd;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        
        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #ffffff;
            position: absolute;
            top: -35px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .icon-circle svg {
            stroke: #d5e8b9;
        }
        
        .subtitle {
            font-size: 24px;
            color: #333333;
            margin: 0 0 15px 0;
            font-weight: bold;
        }
        
        .content {
            font-size: 18px;
            color: #555555;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title">Thiên nhiên và những điều kì thú</h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Content Box 1 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M18 9l-5 5-2-2-4 4"></path></svg>
                </div>
                <h3 class="subtitle">Rạn san hô</h3>
                <p class="content">San hô là <b><i><span style='color:#388E3C'>ngôi nhà</span></i></b> của nhiều loài biển, đang bị <b><i><span style='color:#EF4444'>đe dọa bởi ô nhiễm</span></i></b>.</p>
            </div>
            
            <!-- Content Box 2 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"></path></svg>
                </div>
                <h3 class="subtitle">Cá voi</h3>
                <p class="content">Loài động vật <b><i><span style='color:#3B82F6'>lớn nhất hành tinh</span></i></b> đóng vai trò <b><i><span style='color:#388E3C'>quan trọng trong hệ sinh thái biển</span></i></b>.</p>
            </div>
            
            <!-- Content Box 3 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                </div>
                <h3 class="subtitle">Bảo vệ đại dương</h3>
                <p class="content">Giảm rác thải nhựa và <b><i><span style='color:#388E3C'>khai thác bền vững</span></i></b> để bảo vệ môi trường biển.</p>
            </div>
        </div>
    </div>
</body>
</html>
