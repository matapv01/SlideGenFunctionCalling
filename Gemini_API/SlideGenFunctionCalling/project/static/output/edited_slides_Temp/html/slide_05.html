    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Segoe UI, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
        }
        
        .left-section {
            width: 15%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .vertical-title {
            font-size: 32px;
            color: #333333;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
        }
        
        .green-square {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 20px;
            background-color: #ffffff;
        }
        
        .main-section {
            flex: 1;
            display: flex;
            position: relative;
        }
        
        .content-area {
            width: 65%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .image-area {
            width: 35%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Styling for the content */
        .content-area ul {
            margin-bottom: 30px;
            padding-left: 0;
            list-style-type: none;
        }
        
        .content-area ul li {
            font-size: 18px;
            color: #555555;
            margin-bottom: 5px;
            margin-left: 20px;
        }
        
        /* First line of each ul is treated as a title */
        .content-area ul::before {
            content: attr(data-title);
            display: block;
            font-size: 24px;
            color: #333333;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        /* Add numbers before each ul */
        .content-area ul {
            position: relative;
            padding-left: 50px;
        }
        
        .content-area ul::after {
            content: counter(item, decimal-leading-zero);
            counter-increment: item;
            position: absolute;
            left: 0;
            top: 0;
            font-size: 28px;
            color: #333333;
            font-weight: 300;
            font-style: italic;
        }
    </style>


    <div class="slide-container" bis_skin_checked="1">
        <!-- Left section with vertical title -->
        <div class="left-section" bis_skin_checked="1">
            <div class="green-square" bis_skin_checked="1"></div>
            <div class="vertical-title" bis_skin_checked="1">CÁC LOẠI AI</div>
        </div>
        
        <!-- Main section with content and image -->
        <div class="main-section" bis_skin_checked="1">
            <div class="content-area" bis_skin_checked="1">
                <style>
                    .content-area {
                        counter-reset: item;
                    }
                </style>

            </div>
            
            <div class="image-area" bis_skin_checked="1">

            </div>
        </div>
    </div>
