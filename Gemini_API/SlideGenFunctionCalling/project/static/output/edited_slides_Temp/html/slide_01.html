    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .left-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%;
            height: 100%;
            background-color: #ffffff;
        }
        
        .right-section {
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            background-color: #6ea88a;
        }
        
        .green-bar-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 20px;
            background-color: #c5e6b8;
            z-index: 1;
        }
        
        .green-bar-middle {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #c5e6b8;
            transform: translateY(-50%);
            z-index: 1;
        }
        
        .text-box {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            width: 40%;
            background-color: #c5e6b8;
            padding: 30px;
            z-index: 2;
        }
        
        .main-title {
            font-size: 36px;
            color: #333333;
            margin: 0 0 15px 0;
            font-weight: bold;
            font-style: italic;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 20px;
            color: #555555;
            margin: 5px 0;
        }
        
        .divider {
            width: 100%;
            height: 2px;
            background-color: #e6c35c;
            margin-top: 15px;
        }
        
        .image-frame {
            position: absolute;
            top: 50%;
            right: 10%;
            transform: translateY(-50%);
            width: 30%;
            height: 70%;
            border: 10px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            z-index: 2;
        }
        
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>


    <div class="slide-container" bis_skin_checked="1">
        <!-- Left and right sections -->
        <div class="left-section" bis_skin_checked="1"></div>
        <div class="right-section" bis_skin_checked="1"></div>
        
        <!-- Small green bar at top left -->
        <div class="green-bar-top" bis_skin_checked="1"></div>
        
        <!-- Green bar across the middle -->
        <div class="green-bar-middle" bis_skin_checked="1"></div>
        
        <!-- Text box -->
        <div class="text-box" bis_skin_checked="1">
            <h1 class="main-title">Người Việt Nam nên sử dụng AI như thế nào?</h1>
            <p class="subtitle">Mở đầu <br> Chào hỏi và giới thiệu bản thân: <b>Phạm Văn Minh</b></p>
            <p class="subtitle">Giới thiệu chủ đề thuyết trình <br> Tầm quan trọng của AI trong thời đại 4.0: Tốc độ phát triển vượt trội so với các ngành công nghệ khác.</p>
            <div class="divider" bis_skin_checked="1"></div>
        </div>
        
        <!-- Image frame -->

        </div>
    </div>
