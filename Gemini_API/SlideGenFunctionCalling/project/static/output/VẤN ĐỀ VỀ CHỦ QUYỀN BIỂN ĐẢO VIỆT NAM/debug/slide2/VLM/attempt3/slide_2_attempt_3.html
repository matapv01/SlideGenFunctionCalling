<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
        }
        
        .left-section {
            width: 15%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .vertical-title {
            font-size: 48px;
            color: #666666;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
        }
        
        .green-square {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 20px;
            background-color: #ffffff;
        }
        
        .main-section {
            flex: 1;
            display: flex;
            position: relative;
        }
        
        .content-area {
            width: 65%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .image-area {
            width: 35%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Styling for the content */
        .content-area ul {
            margin-bottom: 30px;
            padding-left: 0;
            list-style-type: none;
        }
        
        .content-area ul li {
            font-size: 32px;
            color: #888888;
            margin-bottom: 5px;
            margin-left: 20px;
        }
        
        /* First line of each ul is treated as a title */
        .content-area ul::before {
            content: attr(data-title);
            display: block;
            font-size: 24px;
            color: #666666;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        /* Add numbers before each ul */
        .content-area ul {
            position: relative;
            padding-left: 50px;
        }
        
        .content-area ul::after {
            content: counter(item, decimal-leading-zero);
            counter-increment: item;
            position: absolute;
            left: 0;
            top: 0;
            font-size: 28px;
            color: #333333;
            font-weight: 300;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Left section with vertical title -->
        <div class="left-section">
            <div class="green-square"></div>
            <div class="vertical-title">PHẦN 1</div>
        </div>
        
        <!-- Main section with content and image -->
        <div class="main-section">
            <div class="content-area">
                <style>
                    .content-area {
                        counter-reset: item;
                    }
                </style>
                <ul style="list-style: none; padding-left: 0;">
    <li><span style="font-size: 24px; color: #666666; font-weight: bold;">Định nghĩa chủ quyền biển đảo</span></li>
    <ul style="list-style: disc; padding-left: 20px;">
        <li>Chủ quyền biển đảo là <span style='color:#3B82F6'><b><i>quyền kiểm soát và quản lý các vùng biển, đảo thuộc chủ quyền quốc gia</i></b></span>.</li>
    </ul>
</ul>
            </div>
            
            <div class="image-area">
                <img src="Picture2.png" alt="Decorative image">
            </div>
        </div>
    </div>
</body>
</html>
