<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .left-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%;
            height: 100%;
            background-color: #ffffff;
        }
        
        .right-section {
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            background-color: #a2c4c9;
        }
        
        .green-bar-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 20px;
            background-color: #e1eff2;
            z-index: 1;
        }
        
        .green-bar-middle {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #e1eff2;
            transform: translateY(-50%);
            z-index: 1;
        }
        
        .text-box {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            width: 40%;
            background-color: #e1eff2;
            padding: 30px;
            z-index: 2;
        }
        
        .main-title {
            font-size: 60px;
            color: #666666;
            margin: 0 0 15px 0;
            font-weight: bold;
            font-style: italic;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 32px;
            color: #888888;
            margin: 5px 0;
        }
        
        .divider {
            width: 100%;
            height: 2px;
            background-color: #a2c4c9;
            margin-top: 15px;
        }
        
        .image-frame {
            position: absolute;
            top: 50%;
            right: 10%;
            transform: translateY(-50%);
            width: 30%;
            height: 70%;
            border: 10px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            z-index: 2;
        }
        
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Left and right sections -->
        <div class="left-section"></div>
        <div class="right-section"></div>
        
        <!-- Small green bar at top left -->
        <div class="green-bar-top"></div>
        
        <!-- Green bar across the middle -->
        <div class="green-bar-middle"></div>
        
        <!-- Text box -->
        <div class="text-box">
            <h1 class="main-title">Chào mừng quý vị và các bạn</h1>
            <p class="subtitle">Đến với buổi thuyết trình.</p>
            <p class="subtitle">Mục tiêu: Khơi dậy sự tò mò và khuyến khích mỗi cá nhân khai thác tiềm năng của AI để phát triển bản thân và cuộc sống.</p>
            <div class="divider"></div>
        </div>
        
        <!-- Image frame -->
        <div class="image-frame">
            <img src="Picture1.png" alt="slide visual">
        </div>
    </div>
</body>
</html>
