<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Lato', sans-serif;
            color: #34495E;
            overflow: hidden;
            background-color: #F8F8F8;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        .text-column {
            flex: 1.5; /* Takes more space */
            padding: 2rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Layered background for the text column only */
            background-image:
                url('https://i.imgur.com/Qy2O1vN.png'),
                linear-gradient(to bottom, transparent 97.5%, #E0E0E0 97.5%),
                url('https://www.toptal.com/designers/subtlepatterns/uploads/paper.png');
            background-repeat: repeat-x, repeat, repeat;
            background-position: bottom, top, top;
            background-size: auto 4rem, 2.5rem 2.5rem, auto;
        }
        
        .image-column {
            flex: 1; /* Takes less space */
            background-image: url('https://images.pexels.com/photos/1072824/pexels-photo-1072824.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
            background-size: cover;
            background-position: center;
        }

        .title {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 400;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }
        
        .text-content {
            font-size: 1.1rem;
            line-height: 1.8;
            max-width: 35ch; /* Limit line length for readability */
        }
        
        /* --- Responsive Design --- */
        @media (max-width: 48rem) { /* 768px */
            .slide-container {
                flex-direction: column;
            }
            .text-column {
                height: 60vh;
                padding: 2rem 2rem 4rem 2rem;
                justify-content: center;
                text-align: center;
            }
            .text-content {
                margin: 0 auto;
            }
            .image-column {
                height: 40vh;
            }
        }

    </style><style>

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
