<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Slide - Enhanced</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        .text-column {
            flex: 0.6; 
            background-color: #FFFFFF;
            color: #1F2937;
            padding: 5rem 6rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .image-column {
            flex: 0.4;
            background-image: url('https://images.unsplash.com/photo-1589182373726-e4f658ab50f0?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }
        
        .title-divider {
            width: 100px;
            height: 5px;
            background: #3B82F6;
            border: none;
            border-radius: 3px;
            margin-bottom: 4rem;
        }

        .references-list {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .reference-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .reference-description {
            font-size: 1.2rem;
            line-height: 1.7;
            font-weight: 400;
            max-width: 45rem;
        }
        
        @media (max-width: 64rem) {
             .text-column { padding: 4rem; }
        }

        @media (max-width: 48rem) {
            .slide-container {
                flex-direction: column-reverse; 
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }
            .text-column, .image-column {
                flex: none;
                width: 100%;
            }
            .image-column {
                height: 20rem; 
            }
             .text-column {
                padding: 3rem 2rem;
             }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="text-column">
            <h1 class="main-title">Phần 3: Núi đồi</h1>
            <hr class="title-divider" />
            <div class="references-list">
                
        <div class="reference-item">
            <h2 class="reference-title">ĐỈNH NÚI CAO</h2>
            <p class="reference-description">Những ngọn núi như Fansipan là <b>nguồn cảm hứng và thử thách</b> cho con người.</p>
        </div>
        
        <div class="reference-item">
            <h2 class="reference-title">ĐỘNG VẬT NÚI</h2>
            <p class="reference-description">Hệ sinh thái núi có nhiều <b>loài đặc hữu</b> thích nghi với điều kiện khắc nghiệt.</p>
        </div>
        
        <div class="reference-item">
            <h2 class="reference-title">DU LỊCH SINH THÁI</h2>
            <p class="reference-description"><b>Du lịch bền vững</b> giúp bảo tồn vẻ đẹp tự nhiên của núi non.</p>
        </div>
        
            </div>
        </div>
        <div class="image-column"></div>
    </div>
</body>
</html>
