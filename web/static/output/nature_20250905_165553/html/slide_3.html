<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Slide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html { 
            font-size: 16px; 
            width: 100vw; 
            height: 100vh;
            overflow: hidden;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2E8B57; /* Full viewport accent background */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5rem 7.5rem; /* 80px 120px */
        }

        .slide-inner-container {
            width: 100%;
            height: 100%;
            max-width: 105rem; /* 1680px */
            max-height: 57.5rem; /* 920px */
            background-color: #FFFFFF;
            border-radius: 1rem; /* 16px */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 3rem 4rem; /* 48px 64px */
            position: relative;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            margin-bottom: 3rem; /* 48px */
        }
        
        .title-accent {
            width: 2.5rem; /* 40px - tăng kích thước */
            height: 2.5rem; /* 40px */
            background-color: #F8F8F8;
            margin-right: 1.25rem; /* 20px */
            border-radius: 0.5rem; /* 8px */
        }
        
        .main-title {
            font-size: 2.5rem;
            color: #000000;
            font-weight: 600;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            justify-content: space-between;
            flex: 1;
            gap: 2rem; /* 32px - tạo gap giữa boxes */
            align-items: stretch;
        }
        
        .content-box {
            flex: 1;
            background: linear-gradient(135deg, #F8F8F8, rgba(230, 242, 221, 0.8));
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 1.5rem 2rem; /* 64px 24px 32px - tăng top padding */
            border-radius: 1rem; /* 16px */
            text-align: center;
            box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 0.125rem solid rgba(255,255,255,0.3);
        }
        
        .content-box:hover {
            transform: translateY(-0.5rem); /* 8px - hover effect */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
        }
        
        .icon-circle {
            width: 5rem; /* 80px - tăng kích thước */
            height: 5rem; /* 80px */
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            position: absolute;
            top: -2.5rem; /* -40px */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.15);
            border: 0.25rem solid rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }
        
        .content-box:hover .icon-circle {
            transform: scale(1.1) rotate(5deg); /* hover animation */
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2);
        }
        
        .icon-circle svg {
            stroke: #2E8B57;
            width: 2rem; /* 32px - tăng kích thước icon */
            height: 2rem; /* 32px */
            filter: drop-shadow(0 0.125rem 0.25rem rgba(0,0,0,0.1));
        }
        
        .subtitle {
            font-size: 1.4rem;
            color: #2E8B57;
            margin: 0 0 1.25rem 0; /* 20px */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }
        
        .content {
            font-size: 1.3rem;
            color: #000000;
            margin: 0;
            line-height: 1.6;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Responsive design */
        @media screen and (max-width: 75rem) {
            body {
                padding: 3rem 5rem;
            }
            
            .content-layout {
                flex-direction: column;
                gap: 1.5rem;
            }
            
            .content-box {
                padding: 3rem 1.5rem 1.5rem;
            }
            
            .icon-circle {
                width: 4rem;
                height: 4rem;
                top: -2rem;
            }
            
            .icon-circle svg {
                width: 1.5rem;
                height: 1.5rem;
            }
        }
        
        @media screen and (max-width: 50rem) {
            body {
                padding: 2rem 3rem;
            }
            
            .slide-inner-container {
                padding: 2rem 3rem;
            }
            
            .title-section {
                margin-bottom: 2rem;
            }
            
            .title-font-size {
                font-size: 2rem;
            }
            
            .subtitle-font-size {
                font-size: 1.25rem;
            }
            
            .content-font-size {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide-inner-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title">Phần 3: Núi đồi</h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Content Box 1 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mountain"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
                </div>
                <h3 class="subtitle"><b>Đỉnh núi cao</b></h3>
                <p class="content">Fansipan là <b>nguồn cảm hứng</b> và <b>thử thách</b>.</p>
            </div>
            
            <!-- Content Box 2 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.34l-1.36-1.36a3.5 3.5 0 0 1-1.34-6.84V9a5 5 0 0 1 5-5z"/></svg>
                </div>
                <h3 class="subtitle"><b>Động vật núi</b></h3>
                <p class="content">Hệ sinh thái núi có nhiều loài <b>đặc hữu</b>, thích nghi môi trường <b>khắc nghiệt</b>.</p>
            </div>
            
            <!-- Content Box 3 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 18 2c1 2.4 2 5.5-1 7.6-2.4 2.4-4.6 1.9-7.3 2.9-1.4 1-2 2.3-2 3.5a2.5 2.5 0 0 0 2.5 2.5c.7 0 1.5-.2 2-.7m-1.5-1.5L22 2"/></svg>
                </div>
                <h3 class="subtitle"><b>Du lịch sinh thái</b></h3>
                <p class="content"><b>Du lịch bền vững</b> giúp <b>bảo tồn</b> vẻ đẹp tự nhiên núi non.</p>
            </div>
        </div>
    </div>
</body>
</html>
