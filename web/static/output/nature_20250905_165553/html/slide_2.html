<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Slide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html { 
            font-size: 16px; 
            width: 100vw; 
            height: 100vh;
            overflow: hidden;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2E8B57; /* Full viewport accent background */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5rem 7.5rem; /* 80px 120px */
        }

        .slide-inner-container {
            width: 100%;
            height: 100%;
            max-width: 105rem; /* 1680px */
            max-height: 57.5rem; /* 920px */
            background-color: #FFFFFF;
            border-radius: 1rem; /* 16px */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 3rem 4rem; /* 48px 64px */
            position: relative;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            margin-bottom: 3rem; /* 48px */
        }
        
        .title-accent {
            width: 2.5rem; /* 40px - tăng kích thước */
            height: 2.5rem; /* 40px */
            background-color: #F8F8F8;
            margin-right: 1.25rem; /* 20px */
            border-radius: 0.5rem; /* 8px */
        }
        
        .main-title {
            font-size: 2.5rem;
            color: #000000;
            font-weight: 600;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            justify-content: space-between;
            flex: 1;
            gap: 2rem; /* 32px - tạo gap giữa boxes */
            align-items: stretch;
        }
        
        .content-box {
            flex: 1;
            background: linear-gradient(135deg, #F8F8F8, rgba(230, 242, 221, 0.8));
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 1.5rem 2rem; /* 64px 24px 32px - tăng top padding */
            border-radius: 1rem; /* 16px */
            text-align: center;
            box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 0.125rem solid rgba(255,255,255,0.3);
        }
        
        .content-box:hover {
            transform: translateY(-0.5rem); /* 8px - hover effect */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
        }
        
        .icon-circle {
            width: 5rem; /* 80px - tăng kích thước */
            height: 5rem; /* 80px */
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            position: absolute;
            top: -2.5rem; /* -40px */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.15);
            border: 0.25rem solid rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }
        
        .content-box:hover .icon-circle {
            transform: scale(1.1) rotate(5deg); /* hover animation */
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2);
        }
        
        .icon-circle svg {
            stroke: #2E8B57;
            width: 2rem; /* 32px - tăng kích thước icon */
            height: 2rem; /* 32px */
            filter: drop-shadow(0 0.125rem 0.25rem rgba(0,0,0,0.1));
        }
        
        .subtitle {
            font-size: 1.4rem;
            color: #2E8B57;
            margin: 0 0 1.25rem 0; /* 20px */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }
        
        .content {
            font-size: 1.3rem;
            color: #000000;
            margin: 0;
            line-height: 1.6;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Responsive design */
        @media screen and (max-width: 75rem) {
            body {
                padding: 3rem 5rem;
            }
            
            .content-layout {
                flex-direction: column;
                gap: 1.5rem;
            }
            
            .content-box {
                padding: 3rem 1.5rem 1.5rem;
            }
            
            .icon-circle {
                width: 4rem;
                height: 4rem;
                top: -2rem;
            }
            
            .icon-circle svg {
                width: 1.5rem;
                height: 1.5rem;
            }
        }
        
        @media screen and (max-width: 50rem) {
            body {
                padding: 2rem 3rem;
            }
            
            .slide-inner-container {
                padding: 2rem 3rem;
            }
            
            .title-section {
                margin-bottom: 2rem;
            }
            
            .title-font-size {
                font-size: 2rem;
            }
            
            .subtitle-font-size {
                font-size: 1.25rem;
            }
            
            .content-font-size {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide-inner-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title">Phần 2: Môi trường biển</h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Content Box 1 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-waves"><path d="M2 20v2h20v-2"/><path d="M20 18c-5-2-7-1-12-2V9"/><path d="M2 12s3-1 6-2c3-1 2 0 6 1s5 1 8-2"/></svg>
                </div>
                <h3 class="subtitle"><b>Rạn san hô</b></h3>
                <p class="content">San hô là ngôi nhà của nhiều loài biển, đang bị đe dọa bởi <b>ô nhiễm</b>.</p>
            </div>
            
            <!-- Content Box 2 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-whale"><path d="M12 12v0h.01"/><path d="M17.4 17.4c-1.4.7-2.8 1.1-4.4 1.2-3.2.3-6.4-.9-9.3-3.1-2.9-2.2-4.4-5-4.7-7.8C-1.4 2.8 5.3-2.1 9.5 1c2.6 1.9 3.5 4.6 3.5 6.6 0 1.3-.8 2.5-2 3.3l-5.6 3.8c-.8.5-1.4 1.2-1.7 2-.3.8-.2 1.5.3 2.2.5.6 1.2.9 2.1.9 1.4 0 2.5-.8 3.5-2.1"/><path d="M21.2 14.8c.5-.6.8-1.4.8-2.3 0-.6-.1-1.2-.3-1.8-.5-1.4-1.6-2.5-3.1-3.3-1.5-.8-3.2-1.2-4.9-1.2-1.8 0-3.6.4-5.2 1.2"/><path d="M22 6s.5-2.5-2-4c-2.4-1.5-5.6-.2-7.6 2.3"/></svg>
                </div>
                <h3 class="subtitle"><b>Cá voi</b></h3>
                <p class="content">Loài động vật <b>lớn nhất hành tinh</b> đóng vai trò quan trọng trong hệ sinh thái biển.</p>
            </div>
            
            <!-- Content Box 3 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h3 class="subtitle"><b>Bảo vệ đại dương</b></h3>
                <p class="content">Giảm <b>rác thải nhựa</b> và <b>khai thác bền vững</b> để bảo vệ môi trường biển.</p>
            </div>
        </div>
    </div>
</body>
</html>
