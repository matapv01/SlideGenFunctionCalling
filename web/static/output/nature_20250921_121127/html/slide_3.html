<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 62.5rem; /* THAY ĐỔI: 1000px -> 62.5rem */
            height: 35rem; /* THAY ĐỔI: 560px -> 35rem */
            position: relative;
            background-color: #F9F9F9;
            overflow: hidden;
            box-shadow: 0 0.3125rem 0.9375rem rgba(0, 0, 0, 0.1); /* 5px 15px */
            padding: 2.5rem; /* THAY ĐỔI: 40px -> 2.5rem */
            box-sizing: border-box;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            margin-bottom: 3.75rem; /* THAY ĐỔI: 60px -> 3.75rem */
        }
        
        .title-accent {
            width: 1.875rem; /* THAY ĐỔI: 30px -> 1.875rem */
            height: 1.875rem; /* THAY ĐỔI: 30px -> 1.875rem */
            background-color: #D4E2D4;
            margin-right: 0.9375rem; /* THAY ĐỔI: 15px -> 0.9375rem */
        }
        
        .main-title {
            font-size: 2rem;
            color: #2F4F4F;
            font-weight: normal;
            font-style: italic;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: calc(100% - 7.5rem); /* THAY ĐỔI: 120px -> 7.5rem */
        }
        
        .content-box {
            width: 31%;
            height: 15.625rem;
            background-color: #D4E2D4;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3.75rem 1.25rem 1.25rem; /* THAY ĐỔI: 60px 20px 20px */
            box-sizing: border-box;
            text-align: center;
        }
        
        .icon-circle {
            width: 4.375rem; /* THAY ĐỔI: 70px -> 4.375rem */
            height: 4.375rem; /* THAY ĐỔI: 70px -> 4.375rem */
            border-radius: 50%;
            background-color: #ffffff;
            position: absolute;
            top: -2.1875rem; /* THAY ĐỔI: -35px -> -2.1875rem */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0.25rem 0.375rem rgba(0, 0, 0, 0.1); /* 4px 6px */
        }
        
        .icon-circle svg {
            stroke: #6B8E23;
        }
        
        .subtitle {
            font-size: 1.25rem;
            color: #36454F;
            margin: 0 0 0.9375rem 0; /* THAY ĐỔI: 15px -> 0.9375rem */
            font-weight: bold;
        }
        
        .content {
            font-size: 1rem;
            color: #36454F;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title"><span style="font-family: 'Playfair Display', serif;">Phần 3: Núi đồi</span></h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Content Box 1 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mountain"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
                </div>
                <h3 class="subtitle">ĐỈNH NÚI CAO</h3>
                <p class="content">Những ngọn núi như <b>Fansipan</b> là nguồn cảm hứng và thử thách cho con người.</p>
            </div>
            
            <!-- Content Box 2 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-goat"><path d="M15.5 6.5C14.2 6.8 13.2 8.1 13 9.5"/><path d="M15 12c-2.5 0-2.5 3.5-5 3.5-2.22 0-2.5-1.5-4-1.5"/><path d="M4 13.5c-1.5 0-1.5 2-1.5 3.5 0 2 2.5 3.5 4.5 3.5 3.5 0 4.5-2.5 4.5-5 0-2-1-3.5-2.5-3.5S6 13 6 15.5"/><path d="M11 19.5c0 1.5.5 2.5 2 2.5s2-1 2-2.5"/><path d="M14 10c2.5-1 4.5-3.5 4.5-6 0-2-1.5-2.5-2.5-2.5-1.5 0-2.5 1-3.5 2.5S11 8 11 8"/><path d="M18 10c0 2 2 3.5 3.5 3.5S23 12 23 10c0-1.5-1-4.5-2.5-4.5S18 8 18 10Z"/></svg>
                </div>
                <h3 class="subtitle">ĐỘNG VẬT NÚI</h3>
                <p class="content">Hệ sinh thái núi có nhiều loài <i>đặc hữu</i> thích nghi với điều kiện <b>khắc nghiệt</b>.</p>
            </div>
            
            <!-- Content Box 3 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf"><path d="M11 20A7 7 0 0 1 4 13H2a10 10 0 0 0 10 10z"/><path d="M12 2a7 7 0 0 1 7 7h2a10 10 0 0 0-10-10z"/></svg>
                </div>
                <h3 class="subtitle">DU LỊCH SINH THÁI</h3>
                <p class="content">Du lịch <i>bền vững</i> giúp bảo tồn vẻ đẹp tự nhiên của núi non.</p>
            </div>
        </div>
    </div>
</body>
</html>
