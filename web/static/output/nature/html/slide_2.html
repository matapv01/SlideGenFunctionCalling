<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon List Slide - Adjusted Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Poppins', sans-serif;
            background-color: #F0FDF4;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2rem;
        }

        .slide-container {
            width: 100%;
            max-width: 85rem; /* Tăng max-width */
            /* ĐÃ SỬA ĐỔI: Đảo ngược tỷ lệ, cho cột phải rộng hơn */
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 4rem;
        }

        .title-column {
            padding-right: 2rem;
        }

        .main-title {
            /* ĐÃ SỬA ĐỔI: Font nhỏ hơn */
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.2;
            color: #065F46;
            margin-bottom: 1.5rem;
        }

        .title-divider {
            height: 5px;
            width: 100px;
            background-color: #047857;
            border-radius: 3px;
            border: none;
        }

        .points-column {
            display: flex;
            flex-direction: column;
            gap: 3.5rem; /* Tăng khoảng cách */
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 2.5rem; /* Tăng khoảng cách */
        }

        .icon-circle {
            /* ĐÃ SỬA ĐỔI: Icon to hơn */
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px #04785733;
        }

        .point-title {
            /* ĐÃ SỬA ĐỔI: Font to hơn */
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .point-description {
            /* ĐÃ SỬA ĐỔI: Font to hơn và giãn dòng tốt hơn */
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: 400;
        }
        
        @media (max-width: 48rem) {
            .slide-container {
                grid-template-columns: 1fr;
                gap: 3rem;
                text-align: center;
            }
            .title-column { padding-right: 0; }
            .title-divider { margin: 0 auto; }
            .point-item {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }
        }

    </style>
</head>
<body>
    <div class="slide-container">
        <div class="title-column">
            <h1 class="main-title">Phần 1: Môi trường xanh</h1>
            <hr class="title-divider" />
        </div>
        <div class="points-column">
            
        <div class="point-item">
            <div class="icon-circle" style="background-color: #047857;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="42px" height="42px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #065F46;">Rừng nhiệt đới</h2>
                <p class="point-description" style="color: #10B981;">Là lá phổi xanh của Trái Đất, cung cấp oxy và là nhà của hàng triệu loài sinh vật.</p>
            </div>
        </div>
        
        <div class="point-item">
            <div class="icon-circle" style="background-color: #047857;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="42px" height="42px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #065F46;">Cây cổ thụ</h2>
                <p class="point-description" style="color: #10B981;">Biểu tượng của sức sống mãnh liệt và sự bền vững qua hàng trăm năm.</p>
            </div>
        </div>
        
        <div class="point-item">
            <div class="icon-circle" style="background-color: #047857;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="42px" height="42px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #065F46;">Bảo vệ rừng</h2>
                <p class="point-description" style="color: #10B981;">Trồng rừng và chống phá rừng giúp duy trì cân bằng sinh thái quan trọng.</p>
            </div>
        </div>
        
        </div>
    </div>
</body>
</html>
