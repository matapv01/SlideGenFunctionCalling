<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Layout List Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh; width: 100vw;
            font-family: Inter, sans-serif; overflow: hidden;
        }
        .slide-container { width: 100%; height: 100%; display: flex; }
        .left-column {
            flex: 1; max-width: 35%;
            background-color: #E3F2FD; color: #1A237E;
            padding: 3rem; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .right-column {
            flex: 2; background-color: #FFFFFF; color: #333333;
            padding: 4rem 3rem; overflow-y: auto;
        }
        .points-list { display: flex; flex-direction: column; gap: 2rem; }
        .point-item:not(:last-child) {
            padding-bottom: 2rem; border-bottom: 1px solid #64B5F6;
        }

        /* Font size styles */
        .main-title {
            font-size: 3.5rem;
            font-weight: 900; line-height: 1.2; text-transform: uppercase;
        }
        .point-title {
            font-size: 1.3rem;
            font-weight: 900; text-transform: uppercase; margin-bottom: 0.75rem;
        }
        .point-description {
            font-size: 1.1rem;
            line-height: 1.6; font-weight: 400; max-width: 45rem;
        }
        
        @media (max-width: 768px) {
            .slide-container { flex-direction: column; overflow-y: auto; }
            .left-column { max-width: 100%; width: 100%; flex: none; height: auto; min-height: 12rem; padding: 2rem; }
            .right-column { flex: none; width: 100%; padding: 2.5rem 2rem; }
        }
        
        
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-column">
            <h1 class="main-title">THẾ GIỚI ĐẠI DƯƠNG</h1>
        </div>
        <div class="right-column">
            <div class="points-list">
                
        <div class="point-item">
            <h2 class="point-title">Rạn san hô</h2>
            <p class="point-description">Là <i>ngôi nhà</i> của nhiều loài biển, đang bị đe dọa bởi <b>ô nhiễm</b>.</p>
        </div>
        
        <div class="point-item">
            <h2 class="point-title">Cá voi</h2>
            <p class="point-description">Loài <i>động vật lớn nhất</i> hành tinh, đóng vai trò <b>quan trọng</b> trong hệ sinh thái biển.</p>
        </div>
        
        <div class="point-item">
            <h2 class="point-title">Bảo vệ đại dương</h2>
            <p class="point-description">Cần giảm <i>rác thải nhựa</i> và thúc đẩy <b>khai thác bền vững</b> để bảo vệ môi trường biển.</p>
        </div>
        
            </div>
        </div>
    </div>
</body>
</html>
