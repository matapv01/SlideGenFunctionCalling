<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon List Slide - Adjusted Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Poppins', sans-serif;
            background-color: #E3F2FD;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2rem;
        }

        .slide-container {
            width: 100%;
            max-width: 85rem; /* Tăng max-width */
            /* ĐÃ SỬA ĐỔI: Đảo ngược tỷ lệ, cho cột phải rộng hơn */
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 4rem;
        }

        .title-column {
            padding-right: 2rem;
        }

        .main-title {
            /* ĐÃ SỬA ĐỔI: Font nhỏ hơn */
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.2;
            color: #01579B;
            margin-bottom: 1.5rem;
        }

        .title-divider {
            height: 5px;
            width: 100px;
            background-color: #0288D1;
            border-radius: 3px;
            border: none;
        }

        .points-column {
            display: flex;
            flex-direction: column;
            gap: 3.5rem; /* Tăng khoảng cách */
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 2.5rem; /* Tăng khoảng cách */
        }

        .icon-circle {
            /* ĐÃ SỬA ĐỔI: Icon to hơn */
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px #0288D133;
        }

        .point-title {
            /* ĐÃ SỬA ĐỔI: Font to hơn */
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .point-description {
            /* ĐÃ SỬA ĐỔI: Font to hơn và giãn dòng tốt hơn */
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: 400;
        }
        
        @media (max-width: 48rem) {
            .slide-container {
                grid-template-columns: 1fr;
                gap: 3rem;
                text-align: center;
            }
            .title-column { padding-right: 0; }
            .title-divider { margin: 0 auto; }
            .point-item {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }
        }

    </style>
</head>
<body>
    <div class="slide-container">
        <div class="title-column">
            <h1 class="main-title">Phần 2: Môi trường biển</h1>
            <hr class="title-divider" />
        </div>
        <div class="points-column">
            
        <div class="point-item">
            <div class="icon-circle" style="background-color: #0288D1;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="42px" height="42px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #0277BD;">Rạn san hô</h2>
                <p class="point-description" style="color: #4FC3F7;">Là ngôi nhà của nhiều loài biển, đang bị đe dọa bởi ô nhiễm.</p>
            </div>
        </div>
        
        <div class="point-item">
            <div class="icon-circle" style="background-color: #0288D1;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="42px" height="42px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #0277BD;">Cá voi</h2>
                <p class="point-description" style="color: #4FC3F7;">Loài động vật lớn nhất hành tinh, đóng vai trò quan trọng trong hệ sinh thái biển.</p>
            </div>
        </div>
        
        <div class="point-item">
            <div class="icon-circle" style="background-color: #0288D1;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="42px" height="42px">
                    
                </svg>
            </div>
            <div class="text-content">
                <h2 class="point-title" style="color: #0277BD;">Bảo vệ đại dương</h2>
                <p class="point-description" style="color: #4FC3F7;">Giảm rác thải nhựa và khai thác bền vững để bảo vệ môi trường biển.</p>
            </div>
        </div>
        
        </div>
    </div>
</body>
</html>
