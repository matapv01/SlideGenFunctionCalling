<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Poppins', sans-serif;
            background-color: #E8F5E9;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2rem;
        }

        .slide-container {
            width: 100%;
            max-width: 85rem; /* Tăng max-width */
            /* ĐÃ SỬA ĐỔI: Đảo ngược tỷ lệ, cho cột phải rộng hơn */
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 4rem;
        }

        .title-column {
            padding-right: 2rem;
        }

        .main-title {
            /* ĐÃ SỬA ĐỔI: Font nhỏ hơn */
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.2;
            color: #3E2723;
            margin-bottom: 1.5rem;
        }

        .title-divider {
            height: 5px;
            width: 100px;
            background-color: #6D9E71;
            border-radius: 3px;
            border: none;
        }

        .points-column {
            display: flex;
            flex-direction: column;
            gap: 3.5rem; /* Tăng khoảng cách */
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 2.5rem; /* Tăng khoảng cách */
        }

        .icon-circle {
            /* ĐÃ SỬA ĐỔI: Icon to hơn */
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px #6D9E7133;
        }

        .point-title {
            /* ĐÃ SỬA ĐỔI: Font to hơn */
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .point-description {
            /* ĐÃ SỬA ĐỔI: Font to hơn và giãn dòng tốt hơn */
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: 400;
        }
        
        @media (max-width: 48rem) {
            .slide-container {
                grid-template-columns: 1fr;
                gap: 3rem;
                text-align: center;
            }
            .title-column { padding-right: 0; }
            .title-divider { margin: 0 auto; }
            .point-item {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
