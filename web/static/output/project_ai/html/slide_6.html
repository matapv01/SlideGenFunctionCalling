<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            overflow: hidden;
        }
        
        /* Background with accent color */
        .slide-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #8cc63f;
        }
        
        /* Main content area with white background */
        .slide-content {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            background-color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            overflow: hidden; /* Prevent scrolling */
        }
        
        .main-title {
            font-size: 60px;
            color: #333333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 50px;
            font-weight: bold;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 30px;
            flex: 1;
        }
        
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .item-number {
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .item-title {
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Background with accent color -->
        <div class="slide-background"></div>
        
        <!-- Main content area with white background -->
        <div class="slide-content">
            <h1 class="main-title">Kết Quả Dự Kiến</h1>
            
            <div class="grid-container">
                
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #8cc63f;">01</div>
            <div class="item-title" style="font-size: 28px; color: #333333;">Chỉ số hiệu suất</div>
        </div>
        
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #8cc63f;">02</div>
            <div class="item-title" style="font-size: 28px; color: #333333;">Người dùng</div>
        </div>
        
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #8cc63f;">03</div>
            <div class="item-title" style="font-size: 28px; color: #333333;">Kinh doanh</div>
        </div>
        
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #8cc63f;">04</div>
            <div class="item-title" style="font-size: 28px; color: #333333;">Giải thưởng & Công nhận</div>
        </div>
        
            </div>
        </div>
    </div>
</body>
</html>
