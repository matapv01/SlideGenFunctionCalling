<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết luận</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .message {
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #34495e;
        }

        .cta {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
            transition: transform 0.3s ease;
        }

        .cta:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 50px;
            font-size: 16px;
            opacity: 0.7;
            color: #7f8c8d;
        }
    </style>
</head>

<body>
    <div class="content">
        <div class="title">Cảm ơn bạn!</div>
        <div class="message">
            SlideGen sẽ giúp bạn tạo ra những bài thuyết trình ấn tượng và chuyên nghiệp.
            Hãy bắt đầu ngay hôm nay để trải nghiệm sức mạnh của công nghệ AI!
        </div>
        <button class="cta">Bắt đầu ngay</button>
        <div class="footer">
            SlideGen - Powered by AI Technology
        </div>
    </div>
</body>

</html>
