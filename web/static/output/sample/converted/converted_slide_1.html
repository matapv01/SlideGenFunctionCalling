<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            background-color: white;
        }

        .text-column {
            flex: 1.5;
            background-color: #4F46E5;
            color: #FFFFFF;
            clip-path: url(#angled-divider);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5rem 4rem; /* Tăng padding để có thêm không gian */
        }

        .image-column {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?q=80&w=1887&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .title-group {
            /* Sits at the top because of space-between on parent */
        }

        .main-title {
            /* ĐÃ SỬA ĐỔI: Font to hơn rất nhiều */
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 800;
            line-height: 1.2;
            /* ĐÃ SỬA ĐỔI: Tăng lề dưới */
            margin-bottom: 1.5rem;
        }

        .subtitle {
            /* ĐÃ SỬA ĐỔI: Font to hơn và giãn dòng tốt hơn */
            font-size: 1.3rem;
            font-weight: 400;
            line-height: 1.7;
            opacity: 0.9;
            max-width: 35rem; /* Tăng max-width một chút */
        }

        .footer-decor {
            width: 100%;
            height: 5rem;
            background-color: #3730A3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .arcs {
            width: 5rem;
            height: 5rem;
            position: relative;
        }
        .arcs::before, .arcs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 0.125rem solid #FFFFFF;
            left: -3.5rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .arcs::before { width: 7rem; height: 7rem; }
        .arcs::after { width: 6rem; height: 6rem; }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .dot {
            width: 0.75rem;
            height: 0.75rem;
            background-color: #FFFFFF;
            border-radius: 50%;
        }
        
        @media (max-width: 64rem) {
            .text-column {
                flex: 1;
                clip-path: none;
            }
            .image-column { flex: 1; }
        }

        @media (max-width: 48rem) {
            .slide-container { flex-direction: column; }
            .text-column, .image-column { flex: none; width: 100%; }
            .text-column { height: 60vh; padding: 2.5rem; justify-content: center; text-align: center; }
            .image-column { height: 40vh; }
            .footer-decor { display: none; }
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
