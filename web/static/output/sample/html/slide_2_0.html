<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Slide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html { 
            font-size: 16px; 
            width: 100vw; 
            height: 100vh;
            overflow: hidden;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #4A90E2; /* Full viewport accent background */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5rem 7.5rem; /* 80px 120px */
        }

        .slide-inner-container {
            width: 100%;
            height: 100%;
            max-width: 105rem; /* 1680px */
            max-height: 57.5rem; /* 920px */
            background-color: #FFFFFF;
            border-radius: 1rem; /* 16px */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 3rem 4rem; /* 48px 64px */
            position: relative;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            margin-bottom: 3rem; /* 48px */
        }
        
        .title-accent {
            width: 2.5rem; /* 40px - increased size */
            height: 2.5rem; /* 40px */
            background: linear-gradient(135deg, #E0F2FE, rgba(230, 242, 221, 0.8));
            margin-right: 1.25rem; /* 20px */
            border-radius: 0.5rem; /* 8px */
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.1);
        }
        
        .main-title {
            font-size: 2.75rem;
            color: #333333;
            font-weight: 600;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex: 1;
            gap: 2rem; /* 32px */
        }
        
        .content-box {
            flex: 1;
            background: linear-gradient(135deg, #E0F2FE, rgba(230, 242, 221, 0.9));
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4.5rem 1.5rem 2rem; /* 72px 24px 32px */
            border-radius: 1rem; /* 16px */
            box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
            border: 0.125rem solid transparent; /* 2px */
            overflow: hidden;
        }
        
        .content-box:hover {
            transform: translateY(-0.75rem); /* -12px hover lift */
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,0.15);
            border-color: #4A90E2;
        }
        
        .content-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0.25rem; /* 4px */
            background: linear-gradient(90deg, #4A90E2, rgba(140, 198, 63, 0.6));
            transform: scaleX(0);
            transition: transform 0.3s ease;
            transform-origin: left;
        }
        
        .content-box:hover::before {
            transform: scaleX(1);
        }
        
        .icon-circle {
            width: 5rem; /* 80px - increased size */
            height: 5rem; /* 80px */
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            position: absolute;
            top: -2.5rem; /* -40px */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            border: 0.1875rem solid #4A90E2; /* 3px */
        }
        
        .content-box:hover .icon-circle {
            transform: scale(1.1) rotate(5deg); /* hover effect */
            box-shadow: 0 1rem 2rem rgba(0,0,0,0.2);
        }
        
        .icon-circle svg {
            stroke: #4A90E2;
            width: 2rem; /* 32px - increased size */
            height: 2rem; /* 32px */
            transition: all 0.3s ease;
        }
        
        .content-box:hover .icon-circle svg {
            stroke: #E0F2FE;
            transform: scale(1.1);
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #333333;
            margin: 0 0 1rem 0; /* 16px */
            font-weight: 700;
            position: relative;
        }
        
        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -0.375rem; /* -6px */
            left: 50%;
            transform: translateX(-50%);
            width: 2.5rem; /* 40px */
            height: 0.125rem; /* 2px */
            background: #4A90E2;
            border-radius: 0.0625rem; /* 1px */
            transition: width 0.3s ease;
        }
        
        .content-box:hover .subtitle::after {
            width: 5rem; /* 80px - expand underline on hover */
        }
        
        .content {
            font-size: 1.125rem;
            color: #555555;
            margin: 0;
            line-height: 1.6;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem; /* 20px */
            background: rgba(255,255,255,0.7);
            border-radius: 0.75rem; /* 12px */
            transition: all 0.3s ease;
        }
        
        .content-box:hover .content {
            background: rgba(255,255,255,0.9);
            transform: translateY(-0.125rem); /* -2px */
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.1);
        }
        
        /* Responsive design */
        @media screen and (max-width: 75rem) {
            body {
                padding: 3rem 5rem;
            }
            
            .content-layout {
                flex-direction: column;
                gap: 1.5rem;
            }
            
            .content-box {
                padding: 3rem 2rem 2rem;
            }
            
            .icon-circle {
                top: -1.5rem;
                width: 4rem;
                height: 4rem;
            }
            
            .icon-circle svg {
                width: 1.5rem;
                height: 1.5rem;
            }
        }
        
        @media screen and (max-width: 50rem) {
            body {
                padding: 2rem 3rem;
            }
            
            .slide-inner-container {
                padding: 2rem 3rem;
            }
            
            .content-box {
                padding: 2.5rem 1.5rem 1.5rem;
            }
            
            .main-title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.25rem;
            }
            
            .content {
                font-size: 1rem;
            }
            
            .icon-circle {
                top: -1rem;
                width: 3rem;
                height: 3rem;
            }
            
            .icon-circle svg {
                width: 1.25rem;
                height: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide-inner-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title">CÁC LỢI ÍCH CHÍNH</h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Content Box 1 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1.51-1V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </div>
                <h3 class="subtitle">Quản lý trạng thái</h3>
                <p class="content">Dễ dàng quản lý trạng thái qua các bước.</p>
            </div>
            
            <!-- Content Box 2 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.5M22 12.5a10 10 0 0 1-18.8 4.5"></path></svg>
                </div>
                <h3 class="subtitle">Hỗ trợ chu trình & vòng lặp</h3>
                <p class="content">Hỗ trợ các chu trình và vòng lặp một cách tự nhiên.</p>
            </div>
            
            <!-- Content Box 3 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <h3 class="subtitle">Gỡ lỗi & quan sát</h3>
                <p class="content">Tăng khả năng gỡ lỗi và quan sát luồng dữ liệu.</p>
            </div>
        </div>
    </div>
</body>
</html>
