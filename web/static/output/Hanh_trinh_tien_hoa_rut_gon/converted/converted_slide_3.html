<style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1A202C, #000000);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      position: relative;
      background-color: #1A202C;
      border-radius: 2rem;
      padding: 4rem;
      width: 90%;
      max-width: 800px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }

    .icon-heart {
        position: relative;
        width: 80px;
        height: 80px;
        transform: rotate(-45deg);
        background-color: #ECC94B;
        margin: 0 auto 2.5rem;
    }
    .icon-heart::before, .icon-heart::after {
        content: "";
        position: absolute;
        width: 80px;
        height: 80px;
        background-color: inherit;
        border-radius: 50%;
    }
    .icon-heart::before { top: -40px; left: 0; }
    .icon-heart::after { left: 40px; top: 0; }

    h1 {
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 800;
      color: #ECC94B;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.15);
      margin: 0 0 1.5rem 0;
    }

    p {
      margin-top: 1rem;
      font-size: 1.75rem;
      line-height: 1.6;
      color: #E2E8F0;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* --- ĐÃ XÓA: Toàn bộ phần CSS cho Sparkles & Animation đã được loại bỏ --- */

  </style><style>

</div><script>
(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
</script></body></html>
