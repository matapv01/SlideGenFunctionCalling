<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Intro Slide - Large Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            background-color: white;
        }

        .text-column {
            flex: 1.5;
            background-color: #2D3748;
            color: #E2E8F0;
            clip-path: url(#angled-divider);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5rem 4rem; /* Tăng padding để có thêm không gian */
        }

        .image-column {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1518005020951-eccb4946d8b6?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
        }

        .title-group {
            transform: scale(1); /* Phóng to toàn bộ title group */
            transform-origin: left top;
        }

        .main-title {
            /* ĐÃ SỬA ĐỔI: Font to hơn rất nhiều */
            font-size: clamp(2rem, 3vw, 7rem);
            font-weight: 600;
            line-height: 1.1;
            /* ĐÃ SỬA ĐỔI: Tăng lề dưới */
            margin-bottom: 10rem;
        }

        .subtitle {
            /* ĐÃ SỬA ĐỔI: Font to hơn và giãn dòng tốt hơn */
            font-size: 1.3rem;
            font-weight: 400;
            line-height: 1.7;
            opacity: 0.9;
            max-width: 35rem; /* Tăng max-width một chút */
        }

        .footer-decor {
            width: 100%;
            height: 5rem;
            background-color: #1A202C;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .arcs {
            width: 5rem;
            height: 5rem;
            position: relative;
        }
        .arcs::before, .arcs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 0.125rem solid #E2E8F0;
            left: -3.5rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .arcs::before { width: 7rem; height: 7rem; }
        .arcs::after { width: 6rem; height: 6rem; }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .dot {
            width: 0.75rem;
            height: 0.75rem;
            background-color: #E2E8F0;
            border-radius: 50%;
        }
        
        @media (max-width: 64rem) {
            .text-column {
                flex: 1;
                clip-path: none;
            }
            .image-column { flex: 1; }
        }

        @media (max-width: 48rem) {
            .slide-container { flex-direction: column; }
            .text-column, .image-column { flex: none; width: 100%; }
            .text-column { height: 60vh; padding: 2.5rem; justify-content: center; text-align: center; }
            .image-column { height: 40vh; }
            .footer-decor { display: none; }
        }
    </style>
</head>
<body>
    
    <svg width="0" height="0">
      <defs>
        <clipPath id="angled-divider" clipPathUnits="objectBoundingBox">
          <polygon points="0 0, 1 0, 1 0.85, 0.85 1, 0 1" />
        </clipPath>
      </defs>
    </svg>
    
    <div class="slide-container">
        <div class="text-column">
            <div class="title-group">
                <h1 class="main-title">Tiến hóa loài người</h1>
                <p class="subtitle">Loài người <b>khởi nguồn từ châu Phi</b> khoảng <b>2 triệu năm trước</b>. Các bước ngoặt tiến hóa quan trọng bao gồm: <b>Đi thẳng</b>, <b>sử dụng tay</b>, và <b>phát triển công cụ</b>.</p>
            </div>
            <div class="footer-decor">
                <div class="arcs"></div>
                <div class="dots-grid">
                    <div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div>
                </div>
            </div>
        </div>
        <div class="image-column"></div>
    </div>
</body>
</html>
