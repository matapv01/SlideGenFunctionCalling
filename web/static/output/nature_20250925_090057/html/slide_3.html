<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Icons Slide</title>
    <style>
        /* 
        KHÔNG cố định font-size cho html - để trình duyệt quyết định
        Điều này tôn trọng cài đặt accessibility của người dùng
        */
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 62.5rem;         /* Converted from 1000px (1000/16 = 62.5rem) */
            height: 35rem;          /* Converted from 560px (560/16 = 35rem) */
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 0.3125rem 0.9375rem rgba(0, 0, 0, 0.1); /* Converted shadow */
        }
        
        .title-section {
            position: absolute;
            top: 2.5rem;            /* Converted from 40px (40/16 = 2.5rem) */
            left: 2.5rem;           /* Converted from 40px */
            display: flex;
            align-items: center;
        }
        
        .title-accent {
            width: 1.875rem;        /* Converted from 30px (30/16 = 1.875rem) */
            height: 1.875rem;       /* Converted from 30px */
            background-color: #d5e8b9;
            margin-right: 0.9375rem; /* Converted from 15px (15/16 = 0.9375rem) */
        }
        
        .main-title {
            font-size: 2rem;
            color: #333333;
            font-weight: normal;
            font-style: italic;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            position: absolute;
            top: 6.25rem;           /* Converted from 100px (100/16 = 6.25rem) */
            left: 0;
            width: 100%;
            height: calc(100% - 6.25rem); /* Converted from 100px */
        }
        
        .image-section {
            width: 45%;
            height: 100%;
            position: relative;
            padding: 1.25rem;       /* Converted from 20px (20/16 = 1.25rem) */
            box-sizing: border-box;
        }
        
        .image-frame {
            width: 100%;
            height: 80%;
            position: relative;
            overflow: hidden;
        }
        
        .image-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 90%;
            height: 90%;
            border: 0.9375rem solid #d5e8b9; /* Converted from 15px */
            box-sizing: border-box;
            z-index: 1;
        }
        
        .image-container {
            position: absolute;
            top: 1.25rem;           /* Converted from 20px */
            left: 1.25rem;          /* Converted from 20px */
            width: 90%;
            height: 90%;
            background-color: #f0f0f0;
            overflow: hidden;
            z-index: 2;
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .content-section {
            width: 55%;
            height: 100%;
            padding: 1.25rem 2.5rem; /* Converted from 20px 40px */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .content-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.875rem; /* Converted from 30px */
        }
        
        .icon-container {
            width: 3.125rem;        /* Converted from 50px (50/16 = 3.125rem) */
            height: 3.125rem;       /* Converted from 50px */
            background-color: #d5e8b9;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1.25rem;  /* Converted from 20px */
            flex-shrink: 0;
        }
        
        .icon-container svg {
            width: 1.5rem;          /* Converted from 24px (24/16 = 1.5rem) */
            height: 1.5rem;         /* Converted from 24px */
            stroke: #333333;
        }
        
        .content-text {
            flex: 1;
        }
        
        .subtitle {
            font-size: 1.25rem;
            color: #333333;
            margin: 0 0 0.3125rem 0; /* Converted from 5px (5/16 = 0.3125rem) */
        }
        
        .content {
            font-size: 1rem;
            color: #555555;
            margin: 0;
            line-height: 1.4;
        }
        
        /* Media queries for responsive design */
        @media screen and (max-width: 75rem) {
            .slide-container {
                width: 95vw;
                max-width: 62.5rem;
            }
        }
        
        @media screen and (max-width: 50rem) {
            .slide-container {
                width: 95vw;
                height: auto;
                min-height: 70vh;
            }
            
            .title-section {
                position: static;
                padding: 1.5rem;
                justify-content: center;
            }
            
            .content-layout {
                position: static;
                flex-direction: column;
                height: auto;
            }
            
            .image-section {
                width: 100%;
                height: 20rem;
                order: 2;
            }
            
            .content-section {
                width: 100%;
                padding: 1.5rem;
                order: 1;
            }
            
            .content-item {
                margin-bottom: 1.5rem;
            }
            
            .icon-container {
                width: 2.5rem;
                height: 2.5rem;
                margin-right: 1rem;
            }
            
            .icon-container svg {
                width: 1.25rem;
                height: 1.25rem;
            }
        }
        
        @media screen and (max-width: 30rem) {
            .content-item {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .icon-container {
                margin-right: 0;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title">Phần 3: Núi đồi</h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Image Section -->
            <div class="image-section">
                <div class="image-frame">
                    <div class="image-accent"></div>
                    <div class="image-container">
                        <img src="https://images.unsplash.com/photo-1589182373726-e4f658ab50f0?q=80&w=2071&auto=format&fit=crop" alt="Slide image">
                    </div>
                </div>
            </div>
            
            <!-- Content Section -->
            <div class="content-section">
                <!-- Content Item 1 -->
                <div class="content-item">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"></path></svg>
                    </div>
                    <div class="content-text">
                        <h3 class="subtitle">Đỉnh núi cao</h3>
                        <p class="content">Những ngọn núi như <b>Fansipan</b> là nguồn cảm hứng và <i>thử thách</i> cho con người.</p>
                    </div>
                </div>
                
                <!-- Content Item 2 -->
                <div class="content-item">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"></circle><circle cx="18" cy="8" r="2"></circle><circle cx="20" cy="16" r="2"></circle><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-7 0V15a5 5 0 0 1 5-5z"></path></svg>
                    </div>
                    <div class="content-text">
                        <h3 class="subtitle">Động vật núi</h3>
                        <p class="content">Hệ sinh thái núi có nhiều loài <u>đặc hữu</u> thích nghi với điều kiện khắc nghiệt.</p>
                    </div>
                </div>
                
                <!-- Content Item 3 -->
                <div class="content-item">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                    <div class="content-text">
                        <h3 class="subtitle">Du lịch sinh thái</h3>
                        <p class="content">Du lịch <b>bền vững</b> giúp bảo tồn vẻ đẹp tự nhiên của núi non.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
