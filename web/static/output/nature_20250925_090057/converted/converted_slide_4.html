<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Converted HTML</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background-color: #FFFFFF;
        }

        .slide-container {
            width: 100%; height: 100%;
            display: flex; position: relative;
        }

        .content-column {
            flex: 2;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .color-panel {
            flex: 1;
            position: relative;
            background-color: #16A34A;
            clip-path: url(#angled-thanks-divider);
        }

        .color-panel::before {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #15803D;
            clip-path: url(#angled-thanks-divider);
            transform: translateX(-1.5rem);
            z-index: -1;
        }
        
        .icon-svg {
            width: 3rem;
            height: 3rem;
            margin-bottom: 1.5rem;
        }

        .main-thanks-text {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            color: #16A34A;
            text-transform: uppercase;
        }
        
        @media (max-width: 48rem) {
            .content-column { text-align: center; align-items: center; }
            .color-panel { display: none; }
        }

(function() {
  function resizeContent() {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;
    var ww = window.innerWidth, wh = window.innerHeight;
    var cw = wrapper.offsetWidth, ch = wrapper.offsetHeight;
    var scale = Math.min(ww / cw, wh / ch);
    wrapper.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', resizeContent);
  window.addEventListener('DOMContentLoaded', resizeContent);
})();
