<body class="sidebar-hidden">

    <button class="avatar-toggle" id="avatarToggle" onclick="toggleSidebar()">

    <!-- Sidebar Navigation -->
    <div class="sidebar hidden" id="sidebar">

                <div class="sidebar-user-email" id="sidebarUserEmail">email@example.com</div>
            </div>
        </div>
        
        <div class="sidebar-menu">
            <a href="index.html" class="sidebar-item">
                <i class="bi bi-plus-circle"></i>

            </a>
            <a href="projects.html" class="sidebar-item active">

                <i class="bi bi-person"></i>

            <a href="#" class="sidebar-footer-item" onclick="openChangePassword(); return false;">
                <i class="bi bi-key"></i>

            </a>
            <a href="#" class="sidebar-footer-item logout" onclick="logout(); return false;">

                <span>Đăng xuất</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="projects-container">
        <h1 class="page-title">
            <i class="bi bi-folder"></i> Dự án của tôi
        </h1>

        <div id="loadingIndicator" class="loading">
            <i class="bi bi-arrow-clockwise"></i>
            <p>Đang tải dự án...</p>
        </div>

        <div id="projectsList" style="display: none;">
            <!-- Projects will be loaded here -->
        </div>

        <div id="noProjects" class="no-projects" style="display: none;">
            <i class="bi bi-inbox"></i>
            <h3>Chưa có dự án nào</h3>
            <p>Hãy tạo dự án đầu tiên của bạn!</p>
            <button class="btn btn-action btn-view" onclick="window.location.href='index.html'" style="margin-top: 20px; padding: 6px 12px; font-size: 0.85rem;">
                Tạo dự án mới
            </button>
        </div>
    </div>

    <script>
        // Inline config to avoid loading issues
        const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
        const config = {
            BACKEND_URL: isDevelopment ? 'http://localhost:3000' : '',
            API_BASE_URL: isDevelopment ? 'http://localhost:3000/api' : '/api'
        };
        console.log('=== Projects.html script loaded ===');
        console.log('config object:', config);
        
        // Check authentication
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            console.log('checkAuth: token =', token ? 'exists' : 'null');
            
            if (!token) {
                console.log('checkAuth: No token, redirecting to login');
                window.location.href = 'login.html';
                return false;
            }
            
            try {
                console.log('checkAuth: Fetching from', `${config.BACKEND_URL}/api/auth/me`);
                const response = await fetch(`${config.BACKEND_URL}/api/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                console.log('checkAuth: Response status', response.status);
                
                if (!response.ok) {
                    console.log('checkAuth: Response not OK, redirecting to login');
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                    return false;
                }
                
                const user = await response.json();
                console.log('checkAuth: User authenticated', user.username);
                window.currentUser = user;
                document.getElementById('sidebarUsername').textContent = user.username;
                document.getElementById('sidebarUserEmail').textContent = user.email;
                document.getElementById('avatarToggle').style.display = 'flex';
                return true;
            } catch (error) {
                console.error('checkAuth: Error', error);
                localStorage.removeItem('access_token');
                window.location.href = 'login.html';
                return false;
            }
        }
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const body = document.body;
            const avatarToggle = document.getElementById('avatarToggle');
            
            sidebar.classList.toggle('hidden');
            body.classList.toggle('sidebar-hidden');
            
            if (sidebar.classList.contains('hidden')) {
                avatarToggle.classList.remove('hidden');
            } else {
                avatarToggle.classList.add('hidden');
            }
        }
        
        async function openProfile() {
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`${config.BACKEND_URL}/api/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const profile = await response.json();
                    document.getElementById('profileUsername').value = window.currentUser.username;
                    document.getElementById('profileEmail').value = window.currentUser.email;
                    document.getElementById('profileFullName').value = profile.full_name || '';
                    document.getElementById('profileAvatarUrl').value = profile.avatar_url || '';
                    document.getElementById('profileBio').value = profile.bio || '';
                }
                
                document.getElementById('profileModal').classList.add('active');
            } catch (error) {
                console.error('Failed to load profile:', error);
                alert('Không thể tải thông tin cá nhân');
            }
        }
        
        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }
        
        async function saveProfile(event) {
            event.preventDefault();
            
            const token = localStorage.getItem('access_token');
            const profileData = {
                full_name: document.getElementById('profileFullName').value,
                avatar_url: document.getElementById('profileAvatarUrl').value,
                bio: document.getElementById('profileBio').value
            };
            
            try {
                const response = await fetch(`${config.BACKEND_URL}/api/profile`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profileData)
                });
                
                if (response.ok) {
                    alert('Cập nhật thông tin thành công!');
                    closeProfileModal();
                } else {
                    alert('Không thể cập nhật thông tin');
                }
            } catch (error) {
                console.error('Failed to save profile:', error);
                alert('Lỗi khi cập nhật thông tin');
            }
        }
        
        function openChangePassword() {
            document.getElementById('changePasswordForm').reset();
            document.getElementById('changePasswordModal').classList.add('active');
        }
        
        function closeChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.remove('active');
        }
        
        async function changePassword(event) {
            event.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Mật khẩu mới và xác nhận mật khẩu không khớp!');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Mật khẩu mới phải có ít nhất 6 ký tự!');
                return;
            }
            
            const token = localStorage.getItem('access_token');
            
            try {
                const response = await fetch(`${config.BACKEND_URL}/api/auth/change-password`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                if (response.ok) {
                    alert('Đổi mật khẩu thành công!');
                    closeChangePasswordModal();
                    document.getElementById('changePasswordForm').reset();
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Không thể đổi mật khẩu');
                }
            } catch (error) {
                console.error('Failed to change password:', error);
                alert('Lỗi khi đổi mật khẩu');
            }
        }
        
        // Close sidebar when clicking outside
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const avatarToggle = document.getElementById('avatarToggle');
            const body = document.body;
            
            if (sidebar && avatarToggle && 
                !sidebar.contains(event.target) && 
                !avatarToggle.contains(event.target) &&
                !body.classList.contains('sidebar-hidden')) {
                toggleSidebar();
            }
        });
        
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'login.html';
        }

        // Load projects
        async function loadProjects() {
            if (!await checkAuth()) return;

            const token = localStorage.getItem('access_token');
            
            try {
                const response = await fetch(`${config.BACKEND_URL}/api/projects`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load projects');
                }

                const data = await response.json();
                displayProjects(data.projects);
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <i class="bi bi-exclamation-triangle"></i>
                    <p>Lỗi tải dự án: ${error.message}</p>
                `;
            }
        }

        // Display projects
        function displayProjects(projects) {
            document.getElementById('loadingIndicator').style.display = 'none';

            if (projects.length === 0) {
                document.getElementById('noProjects').style.display = 'block';
                return;
            }

            const projectsList = document.getElementById('projectsList');
            projectsList.style.display = 'block';

            projectsList.innerHTML = projects.map(project => `
                <div class="project-card">
                    <div class="project-header">
                        <h3 class="project-title">${escapeHtml(project.title)}</h3>
                        <span class="status-badge status-${project.status}">
                            ${project.status === 'completed' ? 'Hoàn thành' : 'Nháp'}
                        </span>
                    </div>
                    <div class="project-meta">
                        <div class="meta-item">
                            <i class="bi bi-file-slides"></i>
                            <span>${project.slide_count || 0} slides</span>
                        </div>
                        <div class="meta-item">
                            <i class="bi bi-${project.source_type === 'docx' ? 'file-word' : 'lightbulb'}"></i>
                            <span>${project.source_type === 'docx' ? 'DOCX' : 'Ý tưởng'}</span>
                        </div>
                        <div class="meta-item">
                            <i class="bi bi-clock"></i>
                            <span>${formatDate(project.updated_at)}</span>
                        </div>
                    </div>
                    ${project.description ? `<p class="project-description">${escapeHtml(project.description)}</p>` : ''}
                    <div class="project-actions">
                        <button class="btn-action btn-view" onclick="editProject(${project.id})">
                            <i class="bi bi-pencil"></i> Edit slide
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteProject(${project.id}, '${escapeHtml(project.title)}')">
                            <i class="bi bi-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Edit project
        function editProject(projectId) {
            window.location.href = `edit.html?id=${projectId}`;
        }

        // Delete project
        async function deleteProject(projectId, projectTitle) {
            showDeleteProjectConfirmation(projectId, projectTitle);
        }

        function showDeleteProjectConfirmation(projectId, projectTitle) {
            // Create modal overlay
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                background: rgba(0, 0, 0, 0.5) !important;
                backdrop-filter: blur(4px) !important;
                z-index: 99999 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                animation: fadeIn 0.2s ease !important;
            `;
            
            // Create modal
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: white !important;
                border-radius: 16px !important;
                padding: 32px !important;
                max-width: 450px !important;
                width: 90% !important;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3) !important;
                animation: slideUp 0.3s ease !important;
                position: relative !important;
                z-index: 100000 !important;
            `;
            
            modal.innerHTML = `
                <style>
                    @keyframes fadeIn {
                        from { opacity: 0; }
                        to { opacity: 1; }
                    }
                    @keyframes slideUp {
                        from { transform: translateY(20px); opacity: 0; }
                        to { transform: translateY(0); opacity: 1; }
                    }
                    @keyframes fadeOut {
                        from { opacity: 1; }
                        to { opacity: 0; }
                    }
                </style>
                <div style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 16px;">🗑️</div>
                    <h3 style="margin: 0 0 12px 0; font-size: 24px; color: #1f2937;">Xóa Dự Án?</h3>
                    <p style="margin: 0 0 24px 0; color: #6b7280; font-size: 14px;">
                        Bạn có chắc muốn xóa dự án <strong>"${escapeHtml(projectTitle)}"</strong>?<br>
                        Tất cả slides trong dự án này sẽ bị xóa. Hành động này không thể hoàn tác.
                    </p>
                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button id="cancelDeleteProject" style="
                            padding: 12px 24px;
                            border: 2px solid #e5e7eb;
                            border-radius: 8px;
                            background: white;
                            color: #6b7280;
                            font-size: 14px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: all 0.2s;
                        ">Hủy</button>
                        <button id="confirmDeleteProject" style="
                            padding: 12px 24px;
                            border: none;
                            border-radius: 8px;
                            background: #ef4444;
                            color: white;
                            font-size: 14px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: all 0.2s;
                        ">Xóa Dự Án</button>
                    </div>
                </div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            // Add hover effects
            const cancelBtn = modal.querySelector('#cancelDeleteProject');
            const confirmBtn = modal.querySelector('#confirmDeleteProject');
            
            cancelBtn.onmouseover = () => cancelBtn.style.background = '#f9fafb';
            cancelBtn.onmouseout = () => cancelBtn.style.background = 'white';
            
            confirmBtn.onmouseover = () => confirmBtn.style.background = '#dc2626';
            confirmBtn.onmouseout = () => confirmBtn.style.background = '#ef4444';
            
            // Handle buttons
            cancelBtn.onclick = () => {
                overlay.style.animation = 'fadeOut 0.2s ease';
                setTimeout(() => overlay.remove(), 200);
            };
            
            confirmBtn.onclick = async () => {
                overlay.remove();
                await executeDeleteProject(projectId, projectTitle);
            };
            
            // Close on overlay click
            overlay.onclick = (e) => {
                if (e.target === overlay) {
                    overlay.style.animation = 'fadeOut 0.2s ease';
                    setTimeout(() => overlay.remove(), 200);
                }
            };
        }

        async function executeDeleteProject(projectId, projectTitle) {
            const token = localStorage.getItem('access_token');

            try {
                console.log('🗑️ Deleting project:', projectId);
                const response = await fetch(`${config.BACKEND_URL}/api/projects/${projectId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('Delete failed:', errorData);
                    throw new Error(errorData.detail || 'Failed to delete project');
                }

                // Show success message
                showToast(`✓ Đã xóa dự án "${projectTitle}" thành công`, 'success');
                
                // Reload projects
                loadProjects();
            } catch (error) {
                console.error('Error deleting project:', error);
                showToast(`✗ Lỗi khi xóa dự án: ${error.message}`, 'error');
            }
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) {
                return 'Hôm nay';
            } else if (diffDays === 1) {
                return 'Hôm qua';
            } else if (diffDays < 7) {
                return `${diffDays} ngày trước`;
            } else {
                return date.toLocaleDateString('vi-VN');
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        (async () => {
            console.log('Starting initialization...');
            console.log('Token exists:', !!localStorage.getItem('access_token'));
            const authResult = await checkAuth();
            console.log('Auth result:', authResult);
            if (authResult) {
                await loadProjects();
            }
        })();
    </script>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Thông tin cá nhân</h3>
                <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            </div>
            <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-input" id="profileUsername" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="profileEmail" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-input" id="profileFullName" placeholder="Nhập họ và tên">
                </div>
                <div class="form-group">
                    <label class="form-label">Avatar URL</label>
                    <input type="text" class="form-input" id="profileAvatarUrl" placeholder="URL ảnh đại diện">
                </div>
                <div class="form-group">
                    <label class="form-label">Giới thiệu</label>
                    <textarea class="form-input" id="profileBio" rows="3" placeholder="Giới thiệu về bản thân"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeProfileModal()">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="changePasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Đổi mật khẩu</h3>
                <button class="modal-close" onclick="closeChangePasswordModal()">&times;</button>
            </div>
            <form id="changePasswordForm" onsubmit="changePassword(event)">
                <div class="form-group">
                    <label class="form-label">Mật khẩu hiện tại</label>
                    <input type="password" class="form-input" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" class="form-input" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu mới</label>
                    <input type="password" class="form-input" id="confirmPassword" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeChangePasswordModal()">Hủy</button>
                    <button type="submit" class="btn-primary">Đổi mật khẩu</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
