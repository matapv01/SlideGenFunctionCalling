<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Editor - SlideGen</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/structure-editor.css">
    <style>
        /* ========== WORD-LIKE EDITOR STYLES ========== */

        /* 2-Column Layout */
        .main-content {
            display: flex;
            gap: 1rem;
            height: calc(100vh - 130px);
        }

        .editor-column {
            flex: 7;
            display: flex;
            flex-direction: column;
        }

        .preview-column {
            flex: 5;
        }

        /* Toolbar Styles */
        .editor-toolbar {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 0 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toolbar-select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 120px;
        }

        .toolbar-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }

        .toolbar-select option {
            background: #2a2a3a;
            color: #fff;
        }

        .toolbar-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            transform: translateY(-2px);
        }

        .toolbar-btn-apply {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
        }

        .toolbar-btn-remove {
            background: rgba(220, 53, 69, 0.8);
            border: none;
            color: #fff;
        }

        /* Word-like Editor Container */
        .word-editor {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px 40px;
            overflow-y: auto;
            color: #1a1a1a;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.8;
            min-height: 400px;
        }

        .word-editor:focus {
            outline: none;
        }

        /* Text Block Styles - Level Indentation */
        .text-block {
            display: block;
            padding: 8px 12px 8px 30px;
            /* Increased left padding for handle */
            margin: 4px 0;
            border-radius: 4px;
            position: relative;
            transition: all 0.2s ease;
            user-select: text;
            padding-right: 70px;
            cursor: text;
        }

        .drag-handle {
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            color: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-drag: element;
            /* Allow handle to be dragged */
        }

        .text-block:hover .drag-handle {
            color: rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.05);
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .text-block::before,
        .text-block::after {
            pointer-events: none;
        }

        .text-block:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .text-block.selected {
            box-shadow: 0 0 0 2px #667eea;
        }

        /* Level Indentation */
        .text-level-0 {
            margin-left: 0;
        }

        .text-level-1 {
            margin-left: 0;
        }

        .text-level-2 {
            margin-left: 30px;
        }

        .text-level-3 {
            margin-left: 60px;
        }

        .text-level-4 {
            margin-left: 90px;
        }

        .text-level-5 {
            margin-left: 120px;
        }

        .text-level-6 {
            margin-left: 150px;
        }

        .text-level-7 {
            margin-left: 180px;
        }

        /* Type Styling - Title */
        .text-title {
            border-left: 4px solid #4dabf7;
            background: rgba(77, 171, 247, 0.1);
            font-weight: 600;
            color: #1864ab;
        }

        .text-title::before {
            content: 'T';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #4dabf7;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Type Styling - Content */
        .text-content {
            border-left: 4px solid #69db7c;
            background: rgba(105, 219, 124, 0.1);
            color: #2b8a3e;
        }

        .text-content::before {
            content: 'C';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #69db7c;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Level badges */
        .text-block::after {
            position: absolute;
            right: 35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.1);
            color: #666;
        }

        .text-level-0::after {
            content: 'L0';
            background: #ff6b6b;
            color: #fff;
        }

        .text-level-1::after {
            content: 'L1';
        }

        .text-level-2::after {
            content: 'L2';
        }

        .text-level-3::after {
            content: 'L3';
        }

        .text-level-4::after {
            content: 'L4';
        }

        .text-level-5::after {
            content: 'L5';
        }

        .text-level-6::after {
            content: 'L6';
        }

        .text-level-7::after {
            content: 'L7';
        }

        /* Intro Slide Special Style */
        .text-block.text-level-0.text-title {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(254, 202, 87, 0.15));
            border-left: 4px solid #ff6b6b;
            font-size: 1.2rem;
        }

        .text-block.text-level-0.text-title::before {
            content: 'INTRO';
            background: linear-gradient(135deg, #ff6b6b, #feca57);
        }

        /* Selection info bar */
        .selection-info {
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .selection-info.visible {
            display: flex;
        }

        .selection-text {
            flex: 1;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-value {
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Aurora Overlay -->
    <div class="aurora-overlay"></div>

    <!-- Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container-fluid px-4 py-3">
        <!-- Header -->
        <div class="header-section">
            <button class="btn btn-outline-light" onclick="goBack()">
                <i class="bi bi-arrow-left"></i> Back
            </button>
            <h2 class="header-title">
                <i class="bi bi-file-earmark-word"></i> Structure Editor
            </h2>
            <div class="document-info">
                <i class="bi bi-file-text"></i>
                <span id="documentTitle">Document</span>
            </div>
            <!-- Action Buttons in Header -->
            <div class="header-actions">
                <button class="btn btn-sm btn-secondary" onclick="resetStructure()">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
                <button class="btn btn-sm btn-danger" onclick="cancelEdit()">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
                <button class="btn btn-sm btn-success" onclick="approveAndContinue()">
                    <i class="bi bi-check-circle"></i> Approve & Continue
                </button>
            </div>
        </div>

        <!-- Main Content: 2-Column Layout -->
        <div class="main-content">
            <!-- COLUMN 1: Word-like Editor -->
            <div class="editor-column">
                <div class="panel-container" style="padding: 1rem;">
                    <!-- Toolbar -->
                    <div class="editor-toolbar">

                        <!-- Level Group -->
                        <div class="style-group">
                            <div class="group-label">Level</div>
                            <div class="style-row">
                                <button class="style-card style-normal" onclick="applyFormatting('normal', null)"
                                    title="Normal Text">
                                    <span class="style-preview">Aa</span>
                                    <span class="style-name">Normal</span>
                                </button>
                                <button class="style-card style-intro" onclick="applyFormatting(0, null)"
                                    title="Intro Slide">
                                    <span class="style-preview">Intro</span>
                                    <span class="style-name">L0</span>
                                </button>
                                <button class="style-card style-l1" onclick="applyFormatting(1, null)"
                                    title="Slide (L1)">
                                    <span class="style-preview" style="color:#4dabf7; font-weight:700;">1</span>
                                    <span class="style-name">Slide</span>
                                </button>
                                <button class="style-card style-l2" onclick="applyFormatting(2, null)"
                                    title="Bullet (L2)">
                                    <span class="style-preview" style="color:#748ffc;">2</span>
                                    <span class="style-name">Bullet</span>
                                </button>
                                <button class="style-card style-l3" onclick="applyFormatting(3, null)"
                                    title="Sub-Point (L3)">
                                    <span class="style-preview" style="font-size: 12px; color:#91a7ff;">3</span>
                                    <span class="style-name">Sub</span>
                                </button>
                                <button class="style-card style-l4" onclick="applyFormatting(4, null)" title="Level 4">
                                    <span class="style-preview" style="font-size: 11px; color:#fab005;">4</span>
                                    <span class="style-name">L4</span>
                                </button>
                                <button class="style-card style-l5" onclick="applyFormatting(5, null)" title="Level 5">
                                    <span class="style-preview" style="font-size: 11px; color:#20c997;">5</span>
                                    <span class="style-name">L5</span>
                                </button>
                                <button class="style-card style-l6" onclick="applyFormatting(6, null)" title="Level 6">
                                    <span class="style-preview" style="font-size: 11px; color:#868e96;">6</span>
                                    <span class="style-name">L6</span>
                                </button>
                            </div>
                        </div>

                        <div class="style-separator-group"></div>

                        <!-- Type Group -->
                        <div class="style-group">
                            <div class="group-label">Type</div>
                            <div class="style-row">
                                <button class="style-card style-type-title" onclick="applyFormatting(null, 'title')"
                                    title="Title">
                                    <span class="style-preview"><i class="bi bi-type-h1"></i></span>
                                    <span class="style-name">Title</span>
                                </button>
                                <button class="style-card style-type-content" onclick="applyFormatting(null, 'content')"
                                    title="Content/Text">
                                    <span class="style-preview"><i class="bi bi-text-paragraph"></i></span>
                                    <span class="style-name">Content</span>
                                </button>
                            </div>
                        </div>

                    </div>

                    <style>
                        /* Main Toolbar Layout */
                        .editor-toolbar {
                            display: flex;
                            align-items: center;
                            gap: 12px;
                            overflow-x: auto;
                            padding-bottom: 5px;
                            scrollbar-width: thin;
                        }

                        .style-group {
                            display: flex;
                            flex-direction: column;
                            gap: 2px;
                        }

                        .group-label {
                            font-size: 9px;
                            font-weight: 700;
                            color: #94a3b8;
                            text-transform: uppercase;
                            letter-spacing: 0.5px;
                            padding-left: 1px;
                            margin-bottom: 2px;
                        }

                        .style-row {
                            display: flex;
                            gap: 4px;
                        }

                        /* Compact Card Styles */
                        .style-card {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            min-width: 45px;
                            height: 48px;
                            border: 1px solid #e2e8f0;
                            border-radius: 5px;
                            background: white;
                            cursor: pointer;
                            transition: all 0.1s;
                            padding: 2px;
                        }

                        .style-card:hover {
                            background: #f8fafc;
                            border-color: #cbd5e1;
                            transform: translateY(-1px);
                            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.05);
                        }

                        .style-card:active {
                            transform: translateY(0);
                            background: #e2e8f0;
                        }

                        .style-preview {
                            font-size: 11px;
                            font-weight: 600;
                            color: #334155;
                            margin-bottom: 1px;
                            line-height: 1.2;
                        }

                        .style-name {
                            font-size: 8px;
                            color: #64748b;
                            text-transform: uppercase;
                            font-weight: 500;
                        }

                        /* Separator */
                        .style-separator-group {
                            width: 1px;
                            height: 40px;
                            background: #e2e8f0;
                            margin-top: 10px;
                        }

                        /* Color overrides for visual distinction */
                        .style-intro .style-preview {
                            color: #ff6b6b;
                        }

                        .style-l1 .style-preview {
                            color: #4dabf7;
                            font-size: 12px;
                        }

                        .style-l2 .style-preview {
                            color: #748ffc;
                        }

                        .style-l3 .style-preview {
                            color: #91a7ff;
                        }

                        .style-l4 .style-preview {
                            color: #fab005;
                        }

                        .style-l5 .style-preview {
                            color: #20c997;
                        }

                        .style-l6 .style-preview {
                            color: #868e96;
                        }

                        .style-type-title .style-preview {
                            font-size: 14px;
                            color: #1e293b;
                        }

                        .style-type-content .style-preview {
                            font-size: 14px;
                            color: #1e293b;
                        }

                        /* Active/Selected state */
                        .style-card.active {
                            border-color: #4dabf7;
                            background: #e7f5ff;
                            box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
                        }
                    </style>

                    <!-- Selection Info Bar -->
                    <div class="selection-info" id="selectionInfo">
                        <i class="bi bi-cursor-text"></i>
                        <span class="selection-text" id="selectionText">No text selected</span>
                        <span class="badge bg-secondary" id="selectionLength">0 chars</span>
                    </div>

                    <!-- Word-like Editor -->
                    <div class="word-editor" id="wordEditor" contenteditable="true" spellcheck="false">
                        <div class="text-center text-muted p-4">
                            <i class="bi bi-hourglass-split" style="font-size: 3rem; color: #999;"></i>
                            <p class="mt-2" style="color: #999;">Loading document...</p>
                        </div>
                    </div>

                    <!-- Stats Bar -->
                    <div class="stats-bar">
                        <div class="stat-item">
                            <i class="bi bi-card-text"></i>
                            <span>Blocks:</span>
                            <span class="stat-value" id="blockCount">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="bi bi-collection"></i>
                            <span>Slides:</span>
                            <span class="stat-value" id="slideCountStat">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="bi bi-fonts"></i>
                            <span>Characters:</span>
                            <span class="stat-value" id="charCount">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMN 2: Slide Previews -->
            <div class="preview-column">
                <div class="panel-container">
                    <div class="panel-header">
                        <h5><i class="bi bi-collection"></i> Slide Previews</h5>
                        <span class="badge bg-success" id="slideCount">0 slides</span>
                    </div>

                    <div class="slides-container" id="slidesContainer">
                        <div class="text-center text-muted p-4">
                            <i class="bi bi-file-slides" style="font-size: 3rem;"></i>
                            <p class="mt-2">Format text to generate slides</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Intro Slide Modal -->
    <div class="modal fade" id="introSlideModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add/Edit Intro Slide (Level 0)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Intro Slide Title/Content</label>
                            <textarea class="form-control" id="introSlideInput" rows="6"
                                placeholder="Enter content for intro slide..."></textarea>
                            <small class="text-muted">Character count: <span id="introCharCount">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="saveIntroSlide()">Save Intro Slide</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal fade" id="customAlertModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-info-circle"></i> Notification
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="customAlertMessage">
                    Message here
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div class="modal fade" id="customConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">
                        <i class="bi bi-question-circle"></i> Confirm Action
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="customConfirmMessage">
                    Confirm this action?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" id="customConfirmOk">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Config must load before other JS -->
    <script src="config.js"></script>
    <!-- Custom JS -->
    <script src="js/structure-editor-v2.js?v=10"></script>
</body>

</html>
