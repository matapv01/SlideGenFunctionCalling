<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Editor - SlideGen</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/structure-editor.css">
    <style>
        /* ========== WORD-LIKE EDITOR STYLES ========== */

        /* 2-Column Layout */
        .main-content {
            display: flex;
            gap: 1rem;
            height: calc(100vh - 130px);
        }

        .editor-column {
            flex: 7;
            display: flex;
            flex-direction: column;
        }

        .preview-column {
            flex: 5;
        }

        /* Toolbar Styles */
        .editor-toolbar {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 0 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toolbar-select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 120px;
        }

        .toolbar-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }

        .toolbar-select option {
            background: #2a2a3a;
            color: #fff;
        }

        .toolbar-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            transform: translateY(-2px);
        }

        .toolbar-btn-apply {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
        }

        .toolbar-btn-remove {
            background: rgba(220, 53, 69, 0.8);
            border: none;
            color: #fff;
        }

        /* Word-like Editor Container */
        .word-editor {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px 40px;
            overflow-y: auto;
            color: #1a1a1a;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.8;
            min-height: 400px;
        }

        .word-editor:focus {
            outline: none;
        }

        /* Text Block Styles - Level Indentation */
        .text-block {
            display: block;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            position: relative;
            transition: all 0.2s ease;
        }

        .text-block:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .text-block.selected {
            box-shadow: 0 0 0 2px #667eea;
        }

        /* Level Indentation */
        .text-level-0 {
            margin-left: 0;
        }

        .text-level-1 {
            margin-left: 0;
        }

        .text-level-2 {
            margin-left: 30px;
        }

        .text-level-3 {
            margin-left: 60px;
        }

        .text-level-4 {
            margin-left: 90px;
        }

        .text-level-5 {
            margin-left: 120px;
        }

        .text-level-6 {
            margin-left: 150px;
        }

        .text-level-7 {
            margin-left: 180px;
        }

        /* Type Styling - Title */
        .text-title {
            border-left: 4px solid #4dabf7;
            background: rgba(77, 171, 247, 0.1);
            font-weight: 600;
            color: #1864ab;
        }

        .text-title::before {
            content: 'T';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #4dabf7;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Type Styling - Content */
        .text-content {
            border-left: 4px solid #69db7c;
            background: rgba(105, 219, 124, 0.1);
            color: #2b8a3e;
        }

        .text-content::before {
            content: 'C';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #69db7c;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Level badges */
        .text-block::after {
            position: absolute;
            right: 35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.1);
            color: #666;
        }

        .text-level-0::after {
            content: 'L0';
            background: #ff6b6b;
            color: #fff;
        }

        .text-level-1::after {
            content: 'L1';
        }

        .text-level-2::after {
            content: 'L2';
        }

        .text-level-3::after {
            content: 'L3';
        }

        .text-level-4::after {
            content: 'L4';
        }

        .text-level-5::after {
            content: 'L5';
        }

        /* Intro Slide Special Style */
        .text-block.text-level-0.text-title {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(254, 202, 87, 0.15));
            border-left: 4px solid #ff6b6b;
            font-size: 1.2rem;
        }

        .text-block.text-level-0.text-title::before {
            content: 'INTRO';
            background: linear-gradient(135deg, #ff6b6b, #feca57);
        }

        /* Selection info bar */
        .selection-info {
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .selection-info.visible {
            display: flex;
        }

        .selection-text {
            flex: 1;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-value {
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Aurora Overlay -->
    <div class="aurora-overlay"></div>

    <!-- Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container-fluid px-4 py-3">
        <!-- Header -->
        <div class="header-section">
            <button class="btn btn-outline-light" onclick="goBack()">
                <i class="bi bi-arrow-left"></i> Back
            </button>
            <h2 class="header-title">
                <i class="bi bi-file-earmark-word"></i> Structure Editor
            </h2>
            <div class="document-info">
                <i class="bi bi-file-text"></i>
                <span id="documentTitle">Document</span>
            </div>
            <!-- Action Buttons in Header -->
            <div class="header-actions">
                <button class="btn btn-sm btn-secondary" onclick="resetStructure()">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
                <button class="btn btn-sm btn-danger" onclick="cancelEdit()">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
                <button class="btn btn-sm btn-success" onclick="approveAndContinue()">
                    <i class="bi bi-check-circle"></i> Approve & Continue
                </button>
            </div>
        </div>

        <!-- Main Content: 2-Column Layout -->
        <div class="main-content">
            <!-- COLUMN 1: Word-like Editor -->
            <div class="editor-column">
                <div class="panel-container" style="padding: 1rem;">
                    <!-- Toolbar -->
                    <div class="editor-toolbar">
                        <div class="toolbar-group">
                            <span class="toolbar-label">Level</span>
                            <select class="toolbar-select" id="toolbarLevel">
                                <option value="1" selected>L1 - Slide</option>
                                <option value="2">L2 - Bullet</option>
                                <option value="3">L3 - Sub</option>
                                <option value="4">L4</option>
                                <option value="5">L5</option>
                            </select>
                        </div>

                        <div class="toolbar-group">
                            <span class="toolbar-label">Type</span>
                            <select class="toolbar-select" id="toolbarType">
                                <option value="title">Title</option>
                                <option value="content">Content</option>
                            </select>
                        </div>

                        <div class="toolbar-group">
                            <button class="toolbar-btn toolbar-btn-apply" onclick="applyFormatting()"
                                title="Apply formatting to selected text">
                                <i class="bi bi-check2-circle"></i> Apply
                            </button>
                            <button class="toolbar-btn toolbar-btn-remove" onclick="removeFormatting()"
                                title="Remove formatting from selected block">
                                <i class="bi bi-x-circle"></i> Remove
                            </button>
                        </div>

                        <div class="toolbar-group" style="border-right: none;">
                            <button class="btn btn-sm btn-info" onclick="openIntroSlideModal()" title="Add Intro Slide">
                                <i class="bi bi-plus-lg"></i> Intro Slide
                            </button>
                        </div>
                    </div>

                    <!-- Selection Info Bar -->
                    <div class="selection-info" id="selectionInfo">
                        <i class="bi bi-cursor-text"></i>
                        <span class="selection-text" id="selectionText">No text selected</span>
                        <span class="badge bg-secondary" id="selectionLength">0 chars</span>
                    </div>

                    <!-- Word-like Editor -->
                    <div class="word-editor" id="wordEditor" contenteditable="true" spellcheck="false">
                        <div class="text-center text-muted p-4">
                            <i class="bi bi-hourglass-split" style="font-size: 3rem; color: #999;"></i>
                            <p class="mt-2" style="color: #999;">Loading document...</p>
                        </div>
                    </div>

                    <!-- Stats Bar -->
                    <div class="stats-bar">
                        <div class="stat-item">
                            <i class="bi bi-card-text"></i>
                            <span>Blocks:</span>
                            <span class="stat-value" id="blockCount">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="bi bi-collection"></i>
                            <span>Slides:</span>
                            <span class="stat-value" id="slideCountStat">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="bi bi-fonts"></i>
                            <span>Characters:</span>
                            <span class="stat-value" id="charCount">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMN 2: Slide Previews -->
            <div class="preview-column">
                <div class="panel-container">
                    <div class="panel-header">
                        <h5><i class="bi bi-collection"></i> Slide Previews</h5>
                        <span class="badge bg-success" id="slideCount">0 slides</span>
                    </div>

                    <div class="slides-container" id="slidesContainer">
                        <div class="text-center text-muted p-4">
                            <i class="bi bi-file-slides" style="font-size: 3rem;"></i>
                            <p class="mt-2">Format text to generate slides</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Intro Slide Modal -->
    <div class="modal fade" id="introSlideModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add/Edit Intro Slide (Level 0)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Intro Slide Title/Content</label>
                            <textarea class="form-control" id="introSlideInput" rows="6"
                                placeholder="Enter content for intro slide..."></textarea>
                            <small class="text-muted">Character count: <span id="introCharCount">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="saveIntroSlide()">Save Intro Slide</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal fade" id="customAlertModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-info-circle"></i> Notification
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="customAlertMessage">
                    Message here
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div class="modal fade" id="customConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">
                        <i class="bi bi-question-circle"></i> Confirm Action
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="customConfirmMessage">
                    Confirm this action?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" id="customConfirmOk">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Config must load before other JS -->
    <script src="config.js"></script>
    <!-- Custom JS -->
    <script src="js/structure-editor-v2.js?v=10"></script>
</body>

</html>
