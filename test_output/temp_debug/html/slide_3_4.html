<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1000px;
            height: 560px;
            position: relative;
            overflow: hidden;
        }
        
        /* Background with accent color */
        .slide-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #a2c4c9;
        }
        
        /* Main content area with white background */
        .slide-content {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            background-color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            overflow: hidden; /* Prevent scrolling */
        }
        
        .main-title {
            font-size: 48px;
            color: #666666;
            text-align: center;
            margin-top: 0;
            margin-bottom: 50px;
            font-weight: bold;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 30px;
            flex: 1;
        }
        
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .item-number {
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .item-title {
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Background with accent color -->
        <div class="slide-background"></div>
        
        <!-- Main content area with white background -->
        <div class="slide-content">
            <h1 class="main-title">Môi trường biển</h1>
            
            <div class="grid-container">
                
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #333333;">01</div>
            <div class="item-title" style="font-size: 28px; color: #666666;"><b>Rạn san hô:</b> Ngôi nhà của nhiều loài biển, bị đe dọa bởi ô nhiễm.</div>
        </div>
        
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #333333;">02</div>
            <div class="item-title" style="font-size: 28px; color: #666666;"><b>Cá voi:</b> Loài động vật lớn nhất, quan trọng trong hệ sinh thái biển.</div>
        </div>
        
        <div class="grid-item">
            <div class="item-number" style="font-size: 70px; color: #333333;">03</div>
            <div class="item-title" style="font-size: 28px; color: #666666;"><b>Bảo vệ đại dương:</b> Giảm rác thải nhựa, khai thác bền vững.</div>
        </div>
        
            </div>
        </div>
    </div>
</body>
</html>
