<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Roboto, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 62.5rem; /* THAY ĐỔI: 1000px -> 62.5rem */
            height: 35rem; /* THAY ĐỔI: 560px -> 35rem */
            position: relative;
            background-color: #F8F8F8;
            overflow: hidden;
            box-shadow: 0 0.3125rem 0.9375rem rgba(0, 0, 0, 0.1); /* 5px 15px */
            padding: 2.5rem; /* THAY ĐỔI: 40px -> 2.5rem */
            box-sizing: border-box;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            margin-bottom: 3.75rem; /* THAY ĐỔI: 60px -> 3.75rem */
        }
        
        .title-accent {
            width: 1.875rem; /* THAY ĐỔI: 30px -> 1.875rem */
            height: 1.875rem; /* THAY ĐỔI: 30px -> 1.875rem */
            background-color: #FFFFFF;
            margin-right: 0.9375rem; /* THAY ĐỔI: 15px -> 0.9375rem */
        }
        
        .main-title {
            font-size: 3rem;
            color: #333333;
            font-weight: normal;
            font-style: italic;
            margin: 0;
        }
        
        .content-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: calc(100% - 7.5rem); /* THAY ĐỔI: 120px -> 7.5rem */
        }
        
        .content-box {
            width: 31%;
            height: auto;
            background-color: #FFFFFF;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3.75rem 1.25rem 1.25rem; /* THAY ĐỔI: 60px 20px 20px */
            box-sizing: border-box;
            text-align: center;
        }
        
        .icon-circle {
            width: 4.375rem; /* THAY ĐỔI: 70px -> 4.375rem */
            height: 4.375rem; /* THAY ĐỔI: 70px -> 4.375rem */
            border-radius: 50%;
            background-color: #ffffff;
            position: absolute;
            top: -2.1875rem; /* THAY ĐỔI: -35px -> -2.1875rem */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0.25rem 0.375rem rgba(0, 0, 0, 0.1); /* 4px 6px */
        }
        
        .icon-circle svg {
            stroke: #007bff;
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #555555;
            margin: 0 0 0.9375rem 0; /* THAY ĐỔI: 15px -> 0.9375rem */
            font-weight: bold;
        }
        
        .content {
            font-size: 1.15rem;
            color: #777777;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-accent"></div>
            <h1 class="main-title">Núi đồi</h1>
        </div>
        
        <!-- Content Layout -->
        <div class="content-layout">
            <!-- Content Box 1 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mountain"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
                </div>
                <h3 class="subtitle"><b>Đỉnh núi cao</b></h3>
                <p class="content"><ul><li>Nguồn cảm hứng và thử thách cho con người</li><li>Ví dụ: Fansipan</li></ul></p>
            </div>
            
            <!-- Content Box 2 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bear"><path d="M6.1 12.2C5.3 10.9 5 9.4 5 8a5 5 0 0 1 10 0c0 1.4-.3 2.9-1.1 4.2L12 17l-5.9-4.8Z"/><path d="M10 5a2 2 0 1 0-4 0"/><path d="M14 5a2 2 0 1 1 4 0"/><path d="M12 17v.2c0 1.3-.8 2.5-2 3.2l-1 .6c-1.1.7-2.4 1.2-3.8 1H3c-1.1 0-2-.9-2-2V19c0-1.1.9-2 2-2h1c1.3 0 2.5-.8 3.2-2l.6-1c.7-1.1 1.2-2.4 1-3.8V9c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v.2c0 1.3.8 2.5 2 3.2l1 .6c1.1.7 2.4 1.2 3.8 1H21c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2h-1c-1.3 0-2.5-.8-3.2-2l-.6-1c-.7-1.1-1.2-2.4-1-3.8z"/></svg>
                </div>
                <h3 class="subtitle"><b>Động vật núi</b></h3>
                <p class="content"><ul><li>Hệ sinh thái đa dạng</li><li>Nhiều loài đặc hữu</li><li>Thích nghi với điều kiện khắc nghiệt</li></ul></p>
            </div>
            
            <!-- Content Box 3 -->
            <div class="content-box">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tent"><path d="M10 13L3.35 4.93a.5.5 0 0 0-.87.48l1.84 10.74a1 1 0 0 1-.9 1.1H2a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h20a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2.42a1 1 0 0 1-.9-1.1L21.52 5.4a.5.5 0 0 0-.87-.48L14 13"/><path d="M10 13 12 22l2-9"/></svg>
                </div>
                <h3 class="subtitle"><b>Du lịch sinh thái</b></h3>
                <p class="content"><ul><li>Du lịch bền vững</li><li>Giúp bảo tồn vẻ đẹp tự nhiên</li></ul></p>
            </div>
        </div>
    </div>
</body>
</html>
