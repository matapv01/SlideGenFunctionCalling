[project]
name = "graph"
version = "1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huskywannacry", email = "ttkien1503@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agent",
    "asgi-correlation-id==4.2.0",
    "base",
    "chromadb-client",
    "easydict>=1.13",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "langchain-community>=0.4",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "litellm",
    "logger",
    "markitdown[docx]>=0.1.3",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "storage",
    "tool-registry",
    "typing-extensions>=4.15.0",
    "uvicorn[standard]==0.23.1",
]

[project.scripts]
graph = "graph:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
litellm = { workspace = true }
storage = { workspace = true }
base = { workspace = true }
logger = { workspace = true }
chromadb-client = { workspace = true }
tool-registry = { workspace = true }
agent = { workspace = true }
