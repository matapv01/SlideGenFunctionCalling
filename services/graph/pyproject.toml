[project]
name = "graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huskywannacry", email = "ttkien1503@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asgi-correlation-id==4.2.0",
    "base",
    "fastapi>=0.119.0",
    "litellm",
    "logger",
    "pydantic-settings==2.9.1",
