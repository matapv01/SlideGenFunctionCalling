
networks:
  multidimentional:
    driver: bridge

services:
  litellm_service:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "9510:4000"
    networks:
      - multidimentional
    volumes:
      - ./config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  minio:
    image: quay.io/minio/minio
    ports:
      - 17000:9000
      - 17001:9001
    networks:
      - multidimentional
    environment:
      - MINIO_ROOT_USER=${MINIO__ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO__SECRET_KEY}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

  graph_service:
    build:
      context: .
      dockerfile: dockers/Dockerfile
      args:
        - PACKAGE=graph
        - OPTIONAL_BUILD=src/graph/__init__.py
    ports:
      - "9527:9527"
    networks:
      - multidimentional
    environment:
      - LITELLM__URL=${LITELLM__URL}
      - LITELLM__MODEL=${LITELLM__MODEL}
      - LITELLM__EMBEDDING_MODEL=${LITELLM__EMBEDDING_MODEL}

    volumes:
      - type: bind
        source: ./services/graph/
        target: /home/slidegen/app/services/graph/
      - type: bind
        source: ./libs/
        target: /home/slidegen/app/libs/
    depends_on:
      - litellm_service
    command: uv run graph