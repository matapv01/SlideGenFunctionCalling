services:
  nginx:
    image: nginx:alpine
    container_name: slidegen_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      BACKEND_URL: http://slidegen:12008
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      slidegen:
        condition: service_healthy

  slidegen:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    platform: linux/amd64
    image: slidegen:latest
    container_name: slidegen
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "12008:12008"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./models:/app/models:ro
      - slidegen_db:/app/backend/infrastructure/database
      - slidegen_static:/app/static
      - slidegen_faiss_local:/app/backend/infrastructure/faiss_tool_retriever_index_multilingual_minilm
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  slidegen_db:
  slidegen_static:
  slidegen_faiss_local:
  huggingface_cache:
