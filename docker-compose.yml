services:
  nginx:
    image: nginx:alpine
    container_name: slidegen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      slidegen:
        condition: service_healthy

  slidegen:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    platform: linux/amd64
    image: slidegen:latest
    container_name: slidegen
    restart: unless-stopped
    ports:
      - "12008:12008"
    env_file:
      - .env
    environment:
      EMBEDDING_DEVICE: cpu
      DISABLE_CONVERTER: "0"
    volumes:
      - ./.env:/app/.env:ro
      - slidegen_db:/app/backend/infrastructure/database
      - slidegen_static:/app/static
      - slidegen_faiss:/app/backend/infrastructure/faiss_tool_retriever_index
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  slidegen_db:
  slidegen_static:
  slidegen_faiss:
  huggingface_cache:
