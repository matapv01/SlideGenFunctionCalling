volumes:
  chromadb:

networks:
  multidimentional:
    driver: bridge

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "9510:4000"
    networks:
      - multidimentional
    volumes:
      - ./config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  minio:
    image: quay.io/minio/minio
    ports:
      - 17000:9000
      - 17001:9001
    networks:
      - multidimentional
    environment:
      - MINIO_ROOT_USER=${MINIO__ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO__SECRET_KEY}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    volumes:
      - chromadb:/chroma/.chroma/index
    ports:
      - ${CHROMADB__PORT}:8000
    networks:
      - multidimentional

  graph_service:
    build:
      context: .
      dockerfile: dockers/Dockerfile
      args:
        - PACKAGE=graph
        - OPTIONAL_BUILD=src/graph/__init__.py
    ports:
      - "9527:9527"
    networks:
      - multidimentional
    environment:
      - LITELLM__URL=${LITELLM__URL}
      - LITELLM__MODEL=${LITELLM__MODEL}
      - LITELLM__EMBEDDING_MODEL=${LITELLM__EMBEDDING_MODEL}

      - MINIO__ACCESS_KEY=${MINIO__ACCESS_KEY}
      - MINIO__SECRET_KEY=${MINIO__SECRET_KEY}
      - MINIO__ENDPOINT=${MINIO__ENDPOINT}

      - TOOL_RETRIEVER_URL=${TOOL_RETRIEVER_URL}

      - AGENT__API_KEYS=${GEMINI_API_KEY}
      - AGENT__BASE_URL=${AGENT__URL}

    volumes:
      - type: bind
        source: ./services/graph/
        target: /home/slidegen/app/services/graph/
      - type: bind
        source: ./libs/
        target: /home/slidegen/app/libs/
    depends_on:
      - minio
      - litellm
    command: uv run graph
  tool_service:
    build:
      context: .
      dockerfile: dockers/Dockerfile
      args:
        - PACKAGE=tools
        - OPTIONAL_BUILD=src/tools/__init__.py
    ports:
      - "9229:9229"
    networks:
      - multidimentional

    environment:
      - LITELLM__URL=${LITELLM__URL}
      - LITELLM__MODEL=${LITELLM__MODEL}
      - LITELLM__EMBEDDING_MODEL=${LITELLM__EMBEDDING_MODEL}

      - CHROMADB__HOST=${CHROMADB__HOST}
      - CHROMADB__PORT=${CHROMADB__PORT}
      
    volumes:
      - type: bind
        source: ./services/tools/
        target: /home/slidegen/app/services/tools/
      - type: bind
        source: ./libs/
        target: /home/slidegen/app/libs/

    depends_on:
      - litellm
    command: uv run tools