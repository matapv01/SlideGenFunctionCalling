
    <!DOCTYPE html>
    <html lang="vi">
    <head>
        <meta charset="UTF-8">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
            body {
                width: 1920px; height: 1080px; margin: 0; padding: 0;
                font-family: 'Inter', sans-serif; background-color: #FEF9E1; color: #2C3E50;
                display: grid; 
                grid-template-rows: 280px 1fr;
                grid-template-columns: 1fr;
                row-gap: 20px;
                overflow: hidden;
            }
            .header-section {
                padding: 20px 100px 20px 100px;
            }
            h1 {
                font-size: 72px; color: #005F5F; margin: 0; font-weight: 800; 
                text-transform: uppercase; letter-spacing: -1px;
                border-left: 12px solid #008080; padding-left: 35px;
            }
            .subtitle {
                font-size: 32px; color: #556B2F; margin: 10px 0 0 47px; font-weight: 400;
            }
            .content-area {
                display: grid; 
                grid-template-columns: 500px 1fr;
                gap: 80px;
                padding: 10px 100px 60px 100px;
                position: center;
            }
            .left-panel {
                display: grid;
                grid-template-rows: auto auto;
                gap: 40px;
                align-content: space-around;
            }
            .insight-box {
                background: #FFFFFF; padding: 30px; border-radius: 30px; 
                box-shadow: 15px 15px 0px rgba(0, 128, 128, 0.1);
                border: 3px solid #008080; font-size: 28px; line-height: 1.5;
            }
            .legend-area {
                padding-left: 10px;
                list-style: none; margin: 0;
            }
            .right-panel {
                display: flex; align-items: center; justify-content: center;
                background: rgba(255, 255, 255, 0.5); border-radius: 40px;
            }
        </style>
    </head>
