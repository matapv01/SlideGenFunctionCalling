            html, body {

                font-family: 'Inter', sans-serif; background-color: #FFFFFF; overflow: hidden;
            }
            .slide-container {
                width: 100%; height: 100%; position: relative;
                background-image: radial-gradient(circle at 20px 20px, #f1f1f1 2px, transparent 0);
                background-size: 40px 40px;
            }
            .top-section {
                padding: 60px 100px 20px 100px;
                border-bottom: 2px dashed #F59E0B;
            }
            .main-content {
                display: flex; padding: 40px 100px; gap: 60px;
            }
            .left-column {
                flex: 1; display: flex; flex-direction: column;
            }
            .right-column {
                flex: 2; background: #FAFAFA; border-radius: 40px;

                border: 3px solid #333;
            }
            .insight-box {
                background: #FFF9E6; padding: 35px; border-radius: 20px;
                border: 2px solid #F59E0B; margin-bottom: 40px;
                font-size: 26px; color: #374151;
                line-height: 1.6; position: relative;
            }
            .insight-box::before {
                content: "💡 Insight"; position: absolute; top: -20px; left: 20px;
                background: #F59E0B; color: white; padding: 5px 15px;
                border-radius: 10px; font-weight: bold; font-size: 20px;
            }
            h1 { margin: 0; font-size: 64px; color: #1F2937; }
            .subtitle { font-size: 28px; color: #6B7280; margin-top: 10px; }
