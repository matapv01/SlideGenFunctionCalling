
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-color: #fefaf4;
                --text-color: #3a3730;
                --accent-color: #9a7a63;
                --secondary-accent: #b7b9ab;
                --dark-accent: #6f7067;
                --colors-0: #c9b09a;
                --colors-1: #6f7067;
                --font-family: Outfit, sans-serif;
                --subtitle-color: #3a3730;
                --insight-text-color: #3a3730;
                --main-title-font-size: 100px;
                --subtitle-font-size: 36px;
                --insight-font-size: 20px;
                --legend-font-size: 24px;
            }
            body {
                margin: 0;
                padding: 0;
                background-color: var(--bg-color);
                font-family: var(--font-family);
                color: var(--text-color);
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                position: relative;
            }
            .left-bar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 70px;
                background-color: var(--accent-color);
            }
            .top-right-box {
                position: absolute;
                right: 0;
                top: 0;
                width: 236px;
                height: 77px;
                background-color: var(--secondary-accent);
            }
            .bottom-right-box {
                position: absolute;
                right: 70px;
                bottom: 0;
                width: 374px;
                height: 58px;
                background-color: var(--dark-accent);
            }
            .container {
                padding-left: 150px;
                padding-top: 100px;
                display: flex;
                flex-direction: column;
                height: 100%;
            }
            .header {
                margin-bottom: 80px;
            }
            .main-title {
                font-size: var(--main-title-font-size);
                font-weight: 700;
                margin: 0;
                line-height: 1.1;
                letter-spacing: -2px;
            }
            .subtitle {
                font-size: var(--subtitle-font-size);
                font-weight: 300;
                margin-top: 5px;
                opacity: 0.8;
                color: var(--subtitle-color);
            }
            .charts-row {
                display: flex;
                justify-content: space-between;
                width: 1400px;
                margin-top: 40px;
            }
            .chart-item {
                width: 400px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .pie-container {
                width: 280px;
                height: 280px;
                margin-bottom: 40px;
                position: relative;
            }
            .pie-svg {
                width: 100%;
                height: 100%;
            }
            .chart-label {
                font-size: var(--legend-font-size);
                font-weight: 700;
                margin-bottom: 10px;
                text-transform: uppercase;
                letter-spacing: 2px;
                display: block;
            }
            .insight-text {
                font-size: var(--insight-font-size);
                font-weight: 400;
                line-height: 1.5;
                max-width: 350px;
                opacity: 0.9;
                color: var(--insight-text-color);
            }
        </style>
    </head>
    <body>
        <div class="left-bar"></div>
        <div class="top-right-box"></div>
        <div class="bottom-right-box"></div>
        
        <div class="container">
            <div class="header">
                <h1 class="main-title">ELEGANCE CLASSY</h1>
                <div class="subtitle">Style Agency Infographics</div>
            </div>
            
            <div class="charts-row">
                <div class="chart-item">
                    <div class="pie-container">
                        
        <svg viewBox="0 0 42 42" class="pie-svg">
            <g transform="rotate(-90 21 21)">
                <circle r="15.9" cx="21" cy="21" fill="transparent" stroke="#c9b09a" stroke-width="10" stroke-dasharray="75.0 25.0" stroke-dashoffset="100" /><circle r="15.9" cx="21" cy="21" fill="transparent" stroke="#6f7067" stroke-width="10" stroke-dasharray="25.0 75.0" stroke-dashoffset="25.0" />
                
            </g>
            <text x="21" y="21" text-anchor="middle" dy=".3em" font-family="Outfit, sans-serif" font-size="8" font-weight="700" fill="#3a3730">75%</text>
        </svg>
        
                    </div>
                    <div class="chart-label">Jupiter</div>
                    <div class="insight-text">Jupiter is the biggest planet of them all</div>
                </div>
                
                <div class="chart-item">
                    <div class="pie-container">
                        
        <svg viewBox="0 0 42 42" class="pie-svg">
            <g transform="rotate(-90 21 21)">
                <circle r="15.9" cx="21" cy="21" fill="transparent" stroke="#c9b09a" stroke-width="10" stroke-dasharray="65.0 35.0" stroke-dashoffset="100" /><circle r="15.9" cx="21" cy="21" fill="transparent" stroke="#6f7067" stroke-width="10" stroke-dasharray="35.0 65.0" stroke-dashoffset="35.0" />
                
            </g>
            <text x="21" y="21" text-anchor="middle" dy=".3em" font-family="Outfit, sans-serif" font-size="8" font-weight="700" fill="#3a3730">65%</text>
        </svg>
        
                    </div>
                    <div class="chart-label">Neptune</div>
                    <div class="insight-text">Neptune is the farthest one from the sun</div>
                </div>
                
                <div class="chart-item">
                    <div class="pie-container">
                        
        <svg viewBox="0 0 42 42" class="pie-svg">
            <g transform="rotate(-90 21 21)">
                <circle r="15.9" cx="21" cy="21" fill="transparent" stroke="#c9b09a" stroke-width="10" stroke-dasharray="60.0 40.0" stroke-dashoffset="100" /><circle r="15.9" cx="21" cy="21" fill="transparent" stroke="#6f7067" stroke-width="10" stroke-dasharray="40.0 60.0" stroke-dashoffset="40.0" />
                
            </g>
            <text x="21" y="21" text-anchor="middle" dy=".3em" font-family="Outfit, sans-serif" font-size="8" font-weight="700" fill="#3a3730">60%</text>
        </svg>
        
                    </div>
                    <div class="chart-label">Mercury</div>
                    <div class="insight-text">Mercury is the closest to the sun</div>
                </div>
            </div>
        </div>
    </body>
    </html>
