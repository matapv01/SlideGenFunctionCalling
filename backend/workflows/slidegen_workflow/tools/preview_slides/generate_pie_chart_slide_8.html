
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <style>
    html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Inter, sans-serif;
    background-color: #FFFFFF;
    position: relative;
    --font-family: Inter, sans-serif;
    --accent-color: #FF6B35;
    --main-title-color: #1B2559;
    --subtitle-color: #6B7280;
    --insights-text-color: #374151;
    --main-title-font-size: 64px;
    --subtitle-font-size: 28px;
    --insights-font-size: 26px;
    --color-0: #9CA3AF;
    --color-1: #85BA2A;
    --color-2: #5561D2;
    }
    
    /* Decorative Background Elements based on reference */
    .bg-shape-top {
    position: absolute;
    top: -30px;
    left: 0;
    width: 400px;
    height: 150px;
    background: var(--main-title-color);
    clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
    z-index: 0;
    }
    .bg-shape-accent {
    position: absolute;
    top: 0;
    left: 0;
    width: 150px;
    height: 150px;
    background: var(--accent-color);
    clip-path: polygon(0 0, 80% 0, 0 80%);
    z-index: 1;
    }
    .bg-shape-bottom {
    position: absolute;
    bottom: -50px;
    right: -300px;
    width: 600px;
    height: 120px;
    background: var(--main-title-color);
    clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
    z-index: 0;
    }
    
    .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 60px 80px 40px 80px;
    box-sizing: border-box;
    }
    
    .header {
    margin-bottom: 40px;
    padding-left: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    }
    
    .title-group h1 {
    font-size: var(--main-title-font-size);
    color: var(--accent-color);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    }
    
    .title-group h1 span {
    color: var(--main-title-color);
    }
    
    .subtitle {
    font-size: var(--subtitle-font-size);
    color: var(--subtitle-color);
    margin-top: 10px;
    font-weight: 400;
    }

    .main-content {
    display: flex;
    flex: 1;
    gap: 40px;
    align-items: center;
    justify-content: space-between;
    }
    
    .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    }
    
    .center-panel {
    flex: 2;
    background: #FFFFFF;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    }

    .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    }
    
    .footer-mark {
    position: absolute;
    bottom: 30px;
    right: 10px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    z-index: 10;
    }

    </style>
    </head>
    <body>

    <div class="bg-shape-top"></div>
    <div class="bg-shape-accent"></div>
    <div class="bg-shape-bottom"></div>
    <div class="footer-mark">www.reallygreatsite.com</div>

    <div class="container">
    <div class="header" style="justify-content: center; margin-bottom: 60px;">
        <div class="title-group" style="text-align: center;">
        <h1 style="color: #000000; font-size: 64px; text-transform: none;">Business Inforgraphic</h1>
        <div class="subtitle"><div style='font-size: 28px; color: #6B7280; margin-top: 10px;'>This is subtitle</div></div>
        </div>

    </div>

    <div class="main-content" style="flex-direction: column; align-items: stretch; justify-content: center; padding: 0 40px; box-sizing: border-box; max-width: 1600px; margin: 0 auto; width: 100%;">
        
    <div style="display: flex; align-items: center; justify-content: center; width: 100%; position: relative;">
        <!-- Left Panel -->
        <div style="flex: 1.5; display: flex; flex-direction: column; z-index: 1; margin-right: -40px;">
        
        <div style="background-color: #F3F4F6; border-radius: 60px 0 0 60px; padding: 30px 60px; margin-bottom: 40px; display: flex; flex-direction: column; justify-content: center; height: 160px; box-sizing: border-box; flex-grow: 1;">
        <div style="font-size: 32px; font-weight: bold; color: #5561D2; margin-bottom: 8px;">Asia</div>
        <div style="font-size: 26px; color: #374151; line-height: 1.4;">Asia had a steady increase of 43% in shipment volume.</div>
        </div>
    
        </div>
        
        <!-- Center SVG -->
        <div style="z-index: 10; display: flex; align-items: center; justify-content: center;">
        <svg width="680" height="680" viewBox="60 60 680 680">
            <!-- White background circle to hide overlapping panels -->
            <circle cx="400" cy="400" r="340" fill="white" />
            
        <!-- Background arc -->
        <circle cx="400" cy="400" r="290" fill="none" stroke="none" stroke-width="60"/>
        <!-- Foreground arc -->
        <circle cx="400" cy="400" r="290" fill="none" stroke="#5561D2" stroke-width="60" 
            stroke-dasharray="1822.12373908208" stroke-dashoffset="1038.6105312767857" 
            transform="rotate(102.6, 400, 400)" stroke-linecap="butt"/>
    
        </svg>
        </div>
        
        <!-- Right Panel -->
        <div style="flex: 1.5; display: flex; flex-direction: column; z-index: 1; margin-left: -40px;">
        
        <div style="background-color: #F3F4F6; border-radius: 0 60px 60px 0; padding: 30px 60px; margin-bottom: 40px; display: flex; align-items: center; height: 160px; box-sizing: border-box; gap: 40px; flex-grow: 1;">
        <div style="width: 80px; height: 80px; border-radius: 50%; background-color: #5561D2; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            </svg>
        </div>
        <div style="font-size: 56px; font-weight: bold; color: #5561D2;">
            43%
        </div>
        </div>
    
        </div>
    </div>
    
    </div>
    </div>

    </body>
    </html>
