
    <!DOCTYPE html>
    <html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
        <style>

            }
            .chart-container {
                width: 450px;
                height: 450px;
            }
            svg {
                transform: rotate(-90deg);
                border-radius: 50%;
            }
