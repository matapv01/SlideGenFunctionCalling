
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">

    <style>

    html,body{
        width:1920px;
        height:1080px;
        margin:0;
        padding:0;
        overflow:hidden;
        font-family:Inter, sans-serif;
        background: linear-gradient(135deg, #020c24, #1a2a4a, #5FD9D3);
        color:white;
        --accent-color: #5FD9D3;
        --main-title-color: #5FD9D3;
        --subtitle-color: #FFFFFF;
        --insight-text-color: #FFFFFF;
        --main-title-font-size: 70px;
        --subtitle-font-size: 32px;
        --insight-font-size: 34px;
    }

    .bg-decoration{
        position:absolute;
        width:100%;
        height:100%;
        z-index:0;
        background:radial-gradient(circle at 90% 90%, #1a2a4a 0%, transparent 50%);
    }

    .container{
    position:relative;
    z-index:1;
    padding:80px 100px;
    height:920px;
    display:flex;
    flex-direction:column;
    }

    .header-box{
    margin-bottom:60px;
    border-left:10px solid var(--accent-color);
    padding-left:35px;
    }

    h1{
        font-size: var(--main-title-font-size);
        color: var(--main-title-color);
        margin:0;
        text-transform:uppercase;
        letter-spacing:2px;
    }

    .subtitle{
        font-size: var(--subtitle-font-size);
        color: var(--subtitle-color);
        margin-top:10px;
        opacity:0.8;
    }

    .content-grid{
    display:flex;
    flex:1;
    gap:80px;
    align-items:center;
    }

    .left-col{
    flex:1;
    display:flex;
    flex-direction:column;
    }

    .insight-box{
        background:rgba(255,255,255,0.05);
        border:2px solid var(--accent-color);
        border-radius:25px;
        box-shadow:0 0 15px var(--accent-color)AA;
        padding:35px;
        margin-bottom:40px;
        font-size: var(--insight-font-size);
        color: var(--insight-text-color);
        line-height:1.5;
    }

    .right-col{
    flex:1.2;
    display:flex;
    justify-content:center;
    align-items:center;
    }

    .right-col svg{
    max-width:100%;
    height:auto;
    }

    </style>
    </head>
