
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-light: #fefaf4;
                --bg-dark: #3a3730;
                --grid-line: #9a7a6344;
                --text-default: #6f7067;
            }
            body {
                margin: 0;
                padding: 0;
                background-color: var(--bg-light);
                font-family: Outfit, sans-serif;
                color: var(--text-default);
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                position: relative;
            }
            .left-bar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 650px;
                width: 70px;
                background-color: #c9b09a;
            }
            .top-box-mini {
                position: absolute;
                right: 0;
                top: 0;
                width: 483px;
                height: 50px;
                background-color: #b7b9ab;
            }
            .bottom-left-box {
                position: absolute;
                left: 0;
                bottom: 0;
                width: 235px;
                height: 77px;
                background-color: #b7b9ab;
            }
            .bottom-right-box {
                position: absolute;
                right: 70px;
                bottom: 0;
                width: 374px;
                height: 58px;
                background-color: #b7b9ab;
            }
            .container {
                padding: 80px 100px 80px 170px;
                display: flex;
                flex-direction: column;
                height: 100%;
                box-sizing: border-box;
            }
            .header {
                margin-bottom: 20px;
            }
            .main-title {
                font-size: 100px;
                font-weight: 700;
                margin: 0;
                line-height: 1.1;
                letter-spacing: -2px;
                color: #3a3730;
            }
            .subtitle {
                font-size: 36px;
                font-weight: 300;
                margin-top: 5px;
                opacity: 0.8;
                color: #3a3730aa;
            }
            .legend-container {
                display: flex;
                gap: 60px;
                margin: 40px 0;
                list-style: none;
                padding: 0;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .legend-circle {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                border: 2px solid #9a7a6344;
            }
            .legend-label {
                font-size: 42px;
                font-weight: 700;
                color: var(--text-default);
                letter-spacing: -0.5px;
            }
            .content-layout {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .table-wrapper {
                width: 100%;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                background: white;
                box-shadow: 0 10px 30px rgba(0,0,0,0.05);
                border: 1px solid #9a7a6344;
            }
        </style>
    </head>
    <body>
        <div class="left-bar"></div>
        <div class="top-box-mini"></div>
        <div class="bottom-left-box"></div>
        <div class="bottom-right-box"></div>
        
        <div class="container">
            <div class="header">
                <h1 class="main-title">ELEGANCE CLASSY</h1>
                <div class="subtitle">Minimalist Table Infographics</div>
            </div>
            
            <ul class="legend-container">
            <li class="legend-item">
                <div class="legend-circle" style="background-color: #9a7a63;"></div>
                <span class="legend-label">Marketing</span>
            </li>
            
            <li class="legend-item">
                <div class="legend-circle" style="background-color: #b7b9ab;"></div>
                <span class="legend-label">Financial</span>
            </li>
            
            <li class="legend-item">
                <div class="legend-circle" style="background-color: #faeaaa;"></div>
                <span class="legend-label">Sales</span>
            </li>
            </ul>
            
            <div class="content-layout">
                <div class="table-wrapper">
                    <table>
                        <thead>

                            </tr>
                        </thead>
                        <tbody>
                            
        <tr>
            <td style="padding: 30px 20px; border: 1px solid #9a7a6344; font-weight: 700; color: #6f7067; background: #fefaf4; font-size: 40px; text-align: center;">
                Week 1
            </td>
            <td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #b7b9ab;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td>
        </tr>
        
        <tr>
            <td style="padding: 30px 20px; border: 1px solid #9a7a6344; font-weight: 700; color: #6f7067; background: #fefaf4; font-size: 40px; text-align: center;">
                Week 2
            </td>
            <td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #faeaaa;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td>
        </tr>
        
        <tr>
            <td style="padding: 30px 20px; border: 1px solid #9a7a6344; font-weight: 700; color: #6f7067; background: #fefaf4; font-size: 40px; text-align: center;">
                Week 3
            </td>
            <td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: white; font-size: 28px; line-height: 1.2; background: #9a7a63;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td><td style="padding: 25px 20px; border: 1px solid #9a7a6344; text-align: center; color: #6f7067; font-size: 28px; line-height: 1.2; background: #fefaf4;"></td>
        </tr>
        
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
    </html>
