
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <style>
        html, body {
            width: 1920px;
            height: 1080px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #E0F7FA;
            /* Hiệu ứng gradient nhẹ giống nước */
            background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 60px;
            color: #3D4E5D;
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 26px;
            color: #6B7280;
            margin-top: 15px;
            font-weight: 500;
        }

        .content-flex {
            display: flex;
            flex: 1;
            gap: 60px;
            align-items: center; 
        }

        .left-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-col {
            flex: 1.6;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 137, 123, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .insight-box {
            font-size: 28px;
            color: #374151;
            font-family: 'Be Vietnam Pro', sans-serif;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 20px;
            border-left: 6px solid #A67C52;
        }
        
        .legend-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 28px;
            width: 100%;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 30px;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid white;
        }
        
        .legend-label {
            font-size: 20px;
            color: #3D4E5D;
            font-family: 'Be Vietnam Pro', sans-serif;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

    </style>
    </head>
    <body>

            </div>
