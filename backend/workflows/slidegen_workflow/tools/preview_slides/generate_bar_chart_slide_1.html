    <style>
    html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background-color: #FFFFFF;
        position: relative;
    }
    
    /* Decorative Background Elements based on reference */
    .bg-shape-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 400px;
        height: 150px;
        background: #1B2559; /* Navy */
        clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        z-index: 0;
    }
    .bg-shape-accent {
        position: absolute;
        top: 0;
        left: 0;
        width: 150px;
        height: 150px;
        background: #FF6B35; /* Orange */
        clip-path: polygon(0 0, 80% 0, 0 80%);
        z-index: 1;
    }
    .bg-shape-bottom {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 300px;
        height: 120px;
        clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
        z-index: 0;
    }
    
    .container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 60px 80px 40px 80px;
        box-sizing: border-box;
    }
    
    .header {
        margin-bottom: 40px;
        padding-left: 350px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }
    
    .title-group h1 {
        font-size: 70px;
        color: #FF6B35; /* Orange Title like 'Logistic' */
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .title-group h1 span {
        color: #1B2559; /* Navy part like 'Company' */
    }
    
    .subtitle {
        font-size: 32px;
        color: #6B7280;
        margin-top: 10px;
        font-weight: 400;
    }

    .main-content {
        display: flex;
        flex: 1;
        gap: 60px;
        align-items: center;
    }
    
    .left-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    
    .right-panel {
        flex: 2;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .footer-mark {
        position: absolute;
        bottom: 30px;
        right: 40px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        z-index: 10;
    }
