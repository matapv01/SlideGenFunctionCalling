
    <!DOCTYPE html>

        <style>
            body {
                width: 1920px; height: 1080px; margin: 0; padding: 0;
                background-color: #FDF5E6; /* Light beige */
                font-family: Inter, sans-serif;
                display: flex; flex-direction: column;
                overflow: hidden;
            }
            .top-bar {
                padding: 60px 100px 20px 100px;
            }
            .title-box {
                display: inline-block;
            }
            h1 { margin: 0; font-size: 65px; color: #4A5E7B; text-transform: capitalize; }
            .subtitle { font-size: 28px; color: #8E97A4; margin-top: 10px; padding-left: 20px; }
            
            .content-area {
                display: flex;
                flex: 1;
                padding: 0 80px 60px 80px;
                gap: 40px;
            }
            .left-panel {
                flex: 1.5;
                display: flex; flex-direction: column;
                justify-content: flex-start;
            }
            .legend-container {
                display: flex;
                gap: 30px;
                margin-bottom: 40px;
                padding-left: 20px;
            }
            .chart-panel {
                display: flex; align-items: flex-start; justify-content: flex-start;
            }
            .right-panel {
                flex: 1;
                display: flex; align-items: center; justify-content: center;
            }
            .image-capsule {
                width: 500px;
                height: 800px;
                border-radius: 250px;
                object-fit: cover;
                box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            }
            .decoration-star {
                position: absolute; color: white; font-size: 40px;
            }
        </style>
    </head>
